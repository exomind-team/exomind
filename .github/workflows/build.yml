name: Build & Release

on:
  push:
    branches: [main]
  release:
    types: [created]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-rust@v1
        with:
          toolchain: stable
      - name: Install dependencies
        run: |
          bun install
      - name: Build Windows
        run: |
          bun tauri build --bundles msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: src-tauri/target/release/bundle/msi/

  build-android:
    runs-on: ubuntu-latest
    container: nix-community/nix:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Android
        run: |
          nix-shell --pure shell.nix --run "bun tauri android build"
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/debug/
