name: Beta Source Contracts

# Source proof only. This neither builds nor publishes a Beta candidate.
on:
  workflow_dispatch:
  push:
    branches: [dev, dev-0.6]
    paths: &contract_paths
      - '.agent-spec/config.yaml'
      - '.github/workflows/beta-contract-guard.yml'
      - 'knowledge/**'
      - 'specs/**'
      - 'scripts/dev/beta-contract-*.ts'
      - 'tests/unit/scripts/beta-contract-*.test.ts'
      - 'crates/exomind-beta-host/**'
      - 'crates/exomind-core/**'
      - 'Cargo.toml'
      - 'src-tauri/src/beta*'
      - 'src/beta/**'
      - 'src/ui/app/components/**'
      - 'src/components/ui/**'
      - 'vitest.config.ts'
      - 'tests/setup.ts'
      - 'scripts/dev/supervised-command*'
      - 'tests/unit/beta/**'
      - 'package.json'
      - 'bun.lock'
      - 'Cargo.lock'
  pull_request:
    paths: *contract_paths

permissions:
  contents: read

concurrency:
  group: beta-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-contracts:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_DEV_INCREMENTAL: 'false'
      CARGO_PROFILE_DEV_CODEGEN_UNITS: '16'
      # Env values are passed as argv, never interpolated into a shell program.
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'
      - uses: dtolnay/rust-toolchain@stable
      # runner.* is unavailable in jobs.<id>.env during workflow admission.
      - name: Set external evidence and reusable cache paths
        shell: bash
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/exomind-contract-cache" >> "$GITHUB_ENV"
          echo "CONTRACT_OUT=$RUNNER_TEMP/exomind-contract-evidence" >> "$GITHUB_ENV"
      - name: Install frozen frontend dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Check evidence rejection rules
        run: bun run test:beta:contract-evidence
      - name: Check diagnostic bounds and signed-origin recovery
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          const cases = [
            ['-p', 'exomind-beta-host', '--lib', 'diagnostics::'],
            ['-p', 'exomind-core', '--test', 'origin_provenance', 'conflicting_existing_body_cannot_advance_a_proof_prefix'],
            ['-p', 'exomind-beta-host', '--lib', 'a_position_signature_cannot_be_replayed_at_another_sequence'],
            ['-p', 'exomind-beta-host', '--lib', 'legacy_received_history_backfills_proofs_without_resetting_a_persisted_data_ack'],
            ['-p', 'exomind-beta-host', '--lib', 'relayed_source_requires_current_carrier_endorsement_fixed_key_and_no_revoked_source'],
          ];
          for (const [index, args] of cases.entries()) {
            const output = execFileSync('cargo', ['test', '--locked', ...args, '--', '--test-threads=1'], {
              encoding: 'utf8', maxBuffer: 32 * 1024 * 1024, timeout: index === 0 ? 600000 : 120000,
            });
            process.stdout.write(output);
            const results = [...output.matchAll(/test result: ok\. (\d+) passed; (\d+) failed;/g)];
            assert.ok(results.some(match => Number(match[1]) > 0 && Number(match[2]) === 0), `No passing tests ran for ${args.at(-1)}`);
          }
          NODE
      - name: Install pinned Agent-spec CLI
        run: cargo install agent-spec --version 1.4.0 --locked
      - name: Run source contracts and explicit UI regressions
        shell: bash
        run: |
          args=(--out "$CONTRACT_OUT")
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            args+=(--base "$BASE_SHA")
          fi
          bun run verify:beta:contracts "${args[@]}"
      - name: Retain proof on success or failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: beta-source-contracts-${{ github.sha }}
          path: ${{ runner.temp }}/exomind-contract-evidence
          if-no-files-found: warn
          retention-days: 7
