name: Build & Release

on:
  push:
    tags:
      - 'build/**'      # 构建触发：只构建，不发布
      - 'release/**'     # 发布触发：构建 + GitHub Release
  workflow_dispatch:
    inputs:
      build_scope:
        description: Build scope（构建范围）
        required: true
        default: all
        type: choice
        options:
          - all
          - android
          - windows
          - macos
          - linux

permissions:
  contents: write

env:
  RUST_TOOLCHAIN: stable

jobs:
  build-windows:
    # NOTE: build-android and build-windows both run on the same self-hosted Windows runner.
    # Serializing them (windows after android) prevents resource contention on the single runner.
    # If a dedicated second runner is added in future, this dependency can be removed.
    needs: build-android
    outputs:
      manifest_json: ${{ steps.manifest_windows.outputs.JSON }}
    if: |
      always() &&
      (
        github.event_name != 'workflow_dispatch' ||
        github.event.inputs.build_scope == 'all' ||
        github.event.inputs.build_scope == 'windows'
      ) &&
      (
        github.event.inputs.build_scope == 'windows' ||
        needs.build-android.result == 'success'
      )
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ensure local Bun is available (确保本机 Bun 可用)
        shell: powershell
        run: |
          Write-Host "Install Bun via npm to enforce native Windows binary (通过 npm 强制使用 Windows 原生 Bun)..."
          npm install -g bun
          $npmPrefix = (npm config get prefix).Trim()
          if (-not $npmPrefix) {
            throw "npm prefix is empty; cannot locate global bun install path."
          }
          $env:Path = "$npmPrefix;$env:Path"
          "$npmPrefix" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $bunCmd = Get-Command bun -ErrorAction SilentlyContinue
          if (-not $bunCmd) {
            throw "Bun is unavailable after npm installation. Please ensure bun is installed and on PATH."
          }
          if ($bunCmd.Source -match '(?i)wsl|\\ubuntu\\') {
            throw "Detected WSL bun path: $($bunCmd.Source). Please use native Windows Bun."
          }
          Write-Host "Using Bun from: $($bunCmd.Source)"
          bun --version

      - name: Rust diagnostics (Rust 诊断输出)
        shell: powershell
        run: |
          Write-Host "=== Rust diagnostics / Rust 诊断输出 ==="
          Write-Host "event_name=${{ github.event_name }}"
          Write-Host "ref=${{ github.ref }}"
          Write-Host "build_scope=${{ github.event.inputs.build_scope || 'n/a' }}"
          Write-Host "runner=$env:RUNNER_NAME os=$env:RUNNER_OS arch=$env:RUNNER_ARCH"
          Write-Host "whoami=$(whoami)"
          Write-Host "USERPROFILE=$env:USERPROFILE"
          Write-Host "HOME=$env:HOME"
          Write-Host "CARGO_HOME=$env:CARGO_HOME"
          Write-Host "RUSTUP_HOME=$env:RUSTUP_HOME"

          $cargoBin = Join-Path $env:USERPROFILE ".cargo\bin"
          Write-Host "cargoBin=$cargoBin exists=$(Test-Path $cargoBin)"

          foreach ($name in @("rustup.exe", "rustc.exe", "cargo.exe", "rustup", "rustc", "cargo")) {
            $candidate = Join-Path $cargoBin $name
            Write-Host "candidate=$candidate exists=$(Test-Path $candidate)"
          }

          Write-Host "Get-Command (before prepend PATH):"
          foreach ($cmd in @("rustup", "rustc", "cargo")) {
            $resolved = Get-Command $cmd -ErrorAction SilentlyContinue
            if ($resolved) {
              Write-Host " - $cmd => $($resolved.Source)"
            } else {
              Write-Host " - $cmd => NOT_FOUND"
            }
          }

      - name: Use local Rust toolchain (使用本机 Rust 工具链，禁止 WSL)
        shell: powershell
        run: |
          $preferredCargoHome = "D:\actions-runner\rust\cargo"
          $preferredRustupHome = "D:\actions-runner\rust\rustup"
          $preferredCargoBin = Join-Path $preferredCargoHome "bin"
          if (Test-Path $preferredCargoBin) {
            $env:CARGO_HOME = $preferredCargoHome
            $env:RUSTUP_HOME = $preferredRustupHome
            "CARGO_HOME=$preferredCargoHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "RUSTUP_HOME=$preferredRustupHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            $env:Path = "$preferredCargoBin;$env:Path"
            "$preferredCargoBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

          $cargoBin = Join-Path $env:USERPROFILE ".cargo\bin"
          if (Test-Path $cargoBin) {
            $env:Path = "$cargoBin;$env:Path"
            "$cargoBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

          $rustupCmd = Get-Command rustup -ErrorAction SilentlyContinue
          $rustcCmd = Get-Command rustc -ErrorAction SilentlyContinue
          $cargoCmd = Get-Command cargo -ErrorAction SilentlyContinue
          if ((-not $rustupCmd) -or (-not $rustcCmd) -or (-not $cargoCmd)) {
            throw "Rust toolchain not found on self-hosted Windows runner. Please pre-install rustup/cargo/rustc."
          }

          if (($rustupCmd.Source -match '(?i)wsl|\\ubuntu\\') -or ($rustcCmd.Source -match '(?i)wsl|\\ubuntu\\') -or ($cargoCmd.Source -match '(?i)wsl|\\ubuntu\\')) {
            throw "Detected Rust command from WSL path. Please use native Windows Rust toolchain."
          }

          rustup default stable
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to select stable Rust toolchain. Please install stable locally first (例如: rustup toolchain install stable)."
          }

          rustup show active-toolchain
          rustc -vV
          cargo -V

      - name: Get short commit hash
        id: hash
        shell: powershell
        run: |
          $short = $env:GITHUB_SHA.Substring(0, 7)
          "HASH=$short" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Resolve app version (解析应用版本)
        id: app_version
        shell: powershell
        run: |
          $refName = "${{ github.ref_name }}"
          $appVersion = ""

          if ($refName.StartsWith("release/")) {
            $appVersion = $refName.Substring("release/".Length)
          } elseif ($refName.StartsWith("build/")) {
            $appVersion = $refName.Substring("build/".Length)
          }

          if (-not $appVersion) {
            $packageVersion = (Get-Content -Path "package.json" -Raw | ConvertFrom-Json).version
            $appVersion = [string]$packageVersion
          }

          if ($appVersion.StartsWith("v")) {
            $appVersion = $appVersion.Substring(1)
          }

          if (-not $appVersion) {
            throw "Cannot resolve app version from tag or package.json."
          }

          "APP_VERSION=$appVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Resolved app version: $appVersion"

      - name: Install dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          function Stop-ProcessTree([int]$RootPid) {
            $children = @(Get-CimInstance Win32_Process -Filter "ParentProcessId = $RootPid" -ErrorAction SilentlyContinue)
            foreach ($child in $children) {
              Stop-ProcessTree -RootPid $child.ProcessId
            }
            Stop-Process -Id $RootPid -Force -ErrorAction SilentlyContinue
          }

          function Clear-StaleBunProcesses() {
            $staleBun = @(Get-CimInstance Win32_Process -Filter "Name = 'bun.exe'" -ErrorAction SilentlyContinue | Where-Object { [string]::IsNullOrWhiteSpace($_.CommandLine) })
            foreach ($proc in $staleBun) {
              Write-Warning "Killing stale bun process PID=$($proc.ProcessId) (清理残留 bun 进程)"
              Stop-Process -Id $proc.ProcessId -Force -ErrorAction SilentlyContinue
            }

            $staleCmd = @(Get-CimInstance Win32_Process -Filter "Name = 'cmd.exe'" -ErrorAction SilentlyContinue | Where-Object { [string]::IsNullOrWhiteSpace($_.CommandLine) })
            foreach ($proc in $staleCmd) {
              Write-Warning "Killing stale cmd process PID=$($proc.ProcessId) (清理残留 cmd 进程)"
              Stop-Process -Id $proc.ProcessId -Force -ErrorAction SilentlyContinue
            }
          }

          function Invoke-BunInstallWithRetry([int]$TimeoutSeconds = 900, [int]$MaxAttempts = 2) {
            Clear-StaleBunProcesses
            for ($attempt = 1; $attempt -le $MaxAttempts; $attempt++) {
              Write-Host "bun install attempt $attempt/$MaxAttempts (安装依赖尝试 $attempt/$MaxAttempts)"
              Remove-Item -LiteralPath "node_modules/.bun-install.lock" -Force -ErrorAction SilentlyContinue

              $proc = Start-Process -FilePath "cmd.exe" -ArgumentList @("/c", "bun install --frozen-lockfile") -WorkingDirectory (Get-Location).Path -NoNewWindow -PassThru
              if (-not $proc.WaitForExit($TimeoutSeconds * 1000)) {
                Stop-ProcessTree -RootPid $proc.Id
                Clear-StaleBunProcesses
                Write-Warning "bun install timed out after $TimeoutSeconds seconds."
                if ($attempt -eq $MaxAttempts) {
                  throw "bun install exceeded timeout and all retries are exhausted."
                }
                continue
              }

              if ($proc.ExitCode -eq 0) {
                return
              }

              Write-Warning "bun install exited with code $($proc.ExitCode)."
              if ($attempt -eq $MaxAttempts) {
                throw "bun install failed after $MaxAttempts attempts."
              }
            }
          }

          Invoke-BunInstallWithRetry

      - name: Build Windows NSIS installer (构建 NSIS 安装包)
        run: bun tauri build --bundles nsis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_APP_VERSION: ${{ steps.app_version.outputs.APP_VERSION }}
          VITE_BUILD_HASH: ${{ steps.hash.outputs.HASH }}

      - name: Build Windows MSI installer (构建 MSI 安装包，复用已编译的 Rust)
        run: bun tauri build --bundles msi
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_APP_VERSION: ${{ steps.app_version.outputs.APP_VERSION }}
          VITE_BUILD_HASH: ${{ steps.hash.outputs.HASH }}

      - name: Resolve R2 channel and version (解析 R2 通道与版本)
        id: r2meta
        shell: powershell
        run: |
          $tagName = "${{ github.ref_name }}"
          if ($tagName.StartsWith("release/")) {
            $channel = "release"
            $version = $tagName.Substring("release/".Length)
          } elseif ($tagName.StartsWith("build/")) {
            $channel = "preview"
            $version = $tagName.Substring("build/".Length)
          } else {
            throw "Unsupported tag format: $tagName"
          }

          "CHANNEL=$channel" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "VERSION_DIR=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Normalize Windows assets for R2 (整理 Windows 产物并规范命名)
        id: normalize_windows
        shell: powershell
        run: |
          $version = "${{ steps.r2meta.outputs.VERSION }}"
          $outputDir = "artifacts/r2-upload/windows"
          New-Item -Path $outputDir -ItemType Directory -Force | Out-Null

          $exeSearchRoots = @(
            "src-tauri/target/release/bundle/nsis",
            "target/release/bundle/nsis"
          ) | Where-Object { Test-Path $_ }
          $exe = $exeSearchRoots `
            | ForEach-Object { Get-ChildItem -Path $_ -Recurse -File -Filter *.exe -ErrorAction SilentlyContinue } `
            | Sort-Object LastWriteTime -Descending `
            | Select-Object -First 1
          if (-not $exe) {
            throw "Missing Windows EXE artifact under nsis bundle path."
          }
          $exeOut = Join-Path $outputDir "ExoMind-$version-windows-x64-setup.exe"
          Copy-Item -Path $exe.FullName -Destination $exeOut -Force
          "EXE_OUT=$exeOut" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          $msiSearchRoots = @(
            "src-tauri/target/release/bundle/msi",
            "target/release/bundle/msi"
          ) | Where-Object { Test-Path $_ }
          $msi = $msiSearchRoots `
            | ForEach-Object { Get-ChildItem -Path $_ -Recurse -File -Filter *.msi -ErrorAction SilentlyContinue } `
            | Sort-Object LastWriteTime -Descending `
            | Select-Object -First 1
          if ($msi) {
            $msiOut = Join-Path $outputDir "ExoMind-$version-windows-x64-installer.msi"
            Copy-Item -Path $msi.FullName -Destination $msiOut -Force
            "MSI_OUT=$msiOut" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Upload Windows assets to R2 (上传 Windows 产物到 R2)
        shell: powershell
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          function Upload-R2File([string]$FilePath, [string]$ObjectKey, [string]$ContentType) {
            if (-not (Test-Path $FilePath)) {
              throw "File not found: $FilePath"
            }
            $bucket = "exomind-releases"
            Write-Host "Uploading $FilePath -> $ObjectKey"
            npx wrangler r2 object put "$bucket/$ObjectKey" --file "$FilePath" --content-type "$ContentType" --remote
            if ($LASTEXITCODE -ne 0) {
              throw "Upload failed for $FilePath"
            }
          }

          $channel = "${{ steps.r2meta.outputs.CHANNEL }}"
          $versionDir = "${{ steps.r2meta.outputs.VERSION_DIR }}"

          $exePath = "${{ steps.normalize_windows.outputs.EXE_OUT }}"
          Upload-R2File -FilePath $exePath -ObjectKey "$channel/$versionDir/ExoMind-${{ steps.r2meta.outputs.VERSION }}-windows-x64-setup.exe" -ContentType "application/octet-stream"

          $msiPath = "${{ steps.normalize_windows.outputs.MSI_OUT }}"
          if ($msiPath -and (Test-Path $msiPath)) {
            Upload-R2File -FilePath $msiPath -ObjectKey "$channel/$versionDir/ExoMind-${{ steps.r2meta.outputs.VERSION }}-windows-x64-installer.msi" -ContentType "application/octet-stream"
          }

      - name: Generate Windows manifest (生成 Windows 轻量 manifest 清单)
        id: manifest_windows
        shell: powershell
        run: |
          function New-AssetEntry([string]$RelativeUrl, [string]$FilePath) {
            $size = (Get-Item -LiteralPath $FilePath).Length
            $sha256 = (Get-FileHash -Algorithm SHA256 -Path $FilePath).Hash.ToLowerInvariant()
            return @{
              url = $RelativeUrl
              size = $size
              sha256 = $sha256
            }
          }

          $channel = "${{ steps.r2meta.outputs.CHANNEL }}"
          $version = "${{ steps.r2meta.outputs.VERSION }}"
          $versionDir = "${{ steps.r2meta.outputs.VERSION_DIR }}"
          $manifestDir = "artifacts/manifest"
          New-Item -Path $manifestDir -ItemType Directory -Force | Out-Null

          $assets = @{}
          $exePath = "${{ steps.normalize_windows.outputs.EXE_OUT }}"
          $assets["windows-x64-setup"] = New-AssetEntry -RelativeUrl "$channel/$versionDir/ExoMind-$version-windows-x64-setup.exe" -FilePath $exePath

          $msiPath = "${{ steps.normalize_windows.outputs.MSI_OUT }}"
          if ($msiPath -and (Test-Path $msiPath)) {
            $assets["windows-x64-installer"] = New-AssetEntry -RelativeUrl "$channel/$versionDir/ExoMind-$version-windows-x64-installer.msi" -FilePath $msiPath
          }

          $manifest = @{
            channel = $channel
            version = $version
            tag = "${{ github.ref_name }}"
            assets = $assets
          }

          $manifestPath = Join-Path $manifestDir "windows-manifest.json"
          $manifest | ConvertTo-Json -Depth 12 | Set-Content -Path $manifestPath -Encoding UTF8
          $manifestJson = $manifest | ConvertTo-Json -Depth 12 -Compress
          "PATH=$manifestPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "JSON=$manifestJson" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

  build-macos:
    outputs:
      manifest_json: ${{ steps.manifest_macos.outputs.JSON }}
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_scope == 'all' || github.event.inputs.build_scope == 'macos' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bun
        run: npm install -g bun

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Get short commit hash
        id: hash
        run: echo "HASH=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Resolve app version
        id: app_version
        run: |
          ref_name="${{ github.ref_name }}"
          app_version=""

          if [[ "$ref_name" == release/* ]]; then
            app_version="${ref_name#release/}"
          elif [[ "$ref_name" == build/* ]]; then
            app_version="${ref_name#build/}"
          fi

          if [ -z "$app_version" ]; then
            app_version="$(jq -r '.version' package.json)"
          fi

          app_version="${app_version#v}"

          if [ -z "$app_version" ]; then
            echo "Cannot resolve app version from tag or package.json." >&2
            exit 1
          fi

          echo "APP_VERSION=$app_version" >> "$GITHUB_OUTPUT"
          echo "Resolved app version: $app_version"

      - name: Install dependencies
        run: bun install

      - name: Build macOS app (构建 macOS 应用)
        run: npx tauri build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_APP_VERSION: ${{ steps.app_version.outputs.APP_VERSION }}
          VITE_BUILD_HASH: ${{ steps.hash.outputs.HASH }}

      - name: Resolve R2 channel and version (解析 R2 通道与版本)
        id: r2meta
        shell: bash
        run: |
          set -euo pipefail
          tag_name="${GITHUB_REF_NAME}"
          if [[ "$tag_name" == release/* ]]; then
            channel="release"
            version="${tag_name#release/}"
          elif [[ "$tag_name" == build/* ]]; then
            channel="preview"
            version="${tag_name#build/}"
          else
            echo "::error::Unsupported tag format: $tag_name"
            exit 1
          fi

          echo "CHANNEL=$channel" >> "$GITHUB_OUTPUT"
          echo "VERSION=$version" >> "$GITHUB_OUTPUT"
          echo "VERSION_DIR=$version" >> "$GITHUB_OUTPUT"

      - name: Normalize macOS assets for R2 (整理 macOS 产物并规范命名)
        id: normalize_macos
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.r2meta.outputs.VERSION }}"
          output_dir="artifacts/r2-upload/macos"
          mkdir -p "$output_dir"

          dmg_src=""
          for candidate in \
            "src-tauri/target/release/bundle/dmg" \
            "target/release/bundle/dmg"; do
            if [[ -d "$candidate" ]]; then
              found="$(find "$candidate" -type f -name '*.dmg' | head -n 1)"
              if [[ -n "$found" ]]; then
                dmg_src="$found"
                break
              fi
            fi
          done
          if [[ -z "$dmg_src" ]]; then
            echo "::error::Missing macOS DMG artifact."
            exit 1
          fi

          file_name="$(basename "$dmg_src" | tr '[:upper:]' '[:lower:]')"
          if [[ "$file_name" == *"x64"* || "$file_name" == *"x86_64"* ]]; then
            asset_key="macos-x64"
            output_name="ExoMind-${version}-macos-x64.dmg"
          else
            asset_key="macos-aarch64"
            output_name="ExoMind-${version}-macos-aarch64.dmg"
          fi

          dmg_out="$output_dir/$output_name"
          cp "$dmg_src" "$dmg_out"

          echo "DMG_OUT=$dmg_out" >> "$GITHUB_OUTPUT"
          echo "ASSET_KEY=$asset_key" >> "$GITHUB_OUTPUT"
          echo "OUTPUT_NAME=$output_name" >> "$GITHUB_OUTPUT"

      - name: Upload macOS assets to R2 (上传 macOS 产物到 R2)
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          bucket="exomind-releases"
          channel="${{ steps.r2meta.outputs.CHANNEL }}"
          version_dir="${{ steps.r2meta.outputs.VERSION_DIR }}"
          output_name="${{ steps.normalize_macos.outputs.OUTPUT_NAME }}"
          dmg_out="${{ steps.normalize_macos.outputs.DMG_OUT }}"

          object_key="${channel}/${version_dir}/${output_name}"
          echo "Uploading $dmg_out -> $object_key"
          npx wrangler r2 object put "${bucket}/${object_key}" \
            --file "$dmg_out" \
            --content-type "application/x-apple-diskimage" \
            --remote

      - name: Generate macOS manifest (生成 macOS 轻量 manifest 清单)
        id: manifest_macos
        shell: bash
        run: |
          set -euo pipefail

          channel="${{ steps.r2meta.outputs.CHANNEL }}"
          version="${{ steps.r2meta.outputs.VERSION }}"
          version_dir="${{ steps.r2meta.outputs.VERSION_DIR }}"
          asset_key="${{ steps.normalize_macos.outputs.ASSET_KEY }}"
          output_name="${{ steps.normalize_macos.outputs.OUTPUT_NAME }}"
          dmg_out="${{ steps.normalize_macos.outputs.DMG_OUT }}"
          size="$(wc -c < "$dmg_out" | tr -d '[:space:]')"
          sha256="$(shasum -a 256 "$dmg_out" | awk '{print $1}')"

          manifest_dir="artifacts/manifest"
          mkdir -p "$manifest_dir"
          manifest_path="$manifest_dir/macos-manifest.json"

          jq -n \
            --arg channel "$channel" \
            --arg version "$version" \
            --arg tag "$GITHUB_REF_NAME" \
            --arg asset_key "$asset_key" \
            --arg url "${channel}/${version_dir}/${output_name}" \
            --argjson size "$size" \
            --arg sha256 "$sha256" \
            '{
              channel: $channel,
              version: $version,
              tag: $tag,
              assets: {
                ($asset_key): {
                  url: $url,
                  size: $size,
                  sha256: $sha256
                }
              }
            }' > "$manifest_path"

          echo "PATH=$manifest_path" >> "$GITHUB_OUTPUT"
          echo "JSON=$(jq -c '.' "$manifest_path")" >> "$GITHUB_OUTPUT"

  build-linux:
    outputs:
      manifest_json: ${{ steps.manifest_linux.outputs.JSON }}
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_scope == 'all' || github.event.inputs.build_scope == 'linux' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bun
        run: npm install -g bun

      - name: Install Linux system dependencies (安装 Linux 系统依赖)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libsoup-3.0-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Get short commit hash
        id: hash
        run: echo "HASH=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Resolve app version
        id: app_version
        run: |
          ref_name="${{ github.ref_name }}"
          app_version=""

          if [[ "$ref_name" == release/* ]]; then
            app_version="${ref_name#release/}"
          elif [[ "$ref_name" == build/* ]]; then
            app_version="${ref_name#build/}"
          fi

          if [ -z "$app_version" ]; then
            app_version="$(jq -r '.version' package.json)"
          fi

          app_version="${app_version#v}"

          if [ -z "$app_version" ]; then
            echo "Cannot resolve app version from tag or package.json." >&2
            exit 1
          fi

          echo "APP_VERSION=$app_version" >> "$GITHUB_OUTPUT"
          echo "Resolved app version: $app_version"

      - name: Install dependencies
        run: bun install

      - name: Build Linux app (构建 Linux 应用)
        run: npx tauri build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_APP_VERSION: ${{ steps.app_version.outputs.APP_VERSION }}
          VITE_BUILD_HASH: ${{ steps.hash.outputs.HASH }}

      - name: Resolve R2 channel and version (解析 R2 通道与版本)
        id: r2meta
        shell: bash
        run: |
          set -euo pipefail
          tag_name="${GITHUB_REF_NAME}"
          if [[ "$tag_name" == release/* ]]; then
            channel="release"
            version="${tag_name#release/}"
          elif [[ "$tag_name" == build/* ]]; then
            channel="preview"
            version="${tag_name#build/}"
          else
            echo "::error::Unsupported tag format: $tag_name"
            exit 1
          fi

          echo "CHANNEL=$channel" >> "$GITHUB_OUTPUT"
          echo "VERSION=$version" >> "$GITHUB_OUTPUT"
          echo "VERSION_DIR=$version" >> "$GITHUB_OUTPUT"

      - name: Normalize Linux assets for R2 (整理 Linux 产物并规范命名)
        id: normalize_linux
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.r2meta.outputs.VERSION }}"
          output_dir="artifacts/r2-upload/linux"
          mkdir -p "$output_dir"

          deb_src=""
          for candidate in \
            "src-tauri/target/release/bundle/deb" \
            "target/release/bundle/deb"; do
            if [[ -d "$candidate" ]]; then
              found="$(find "$candidate" -type f -name '*.deb' | head -n 1)"
              if [[ -n "$found" ]]; then
                deb_src="$found"
                break
              fi
            fi
          done

          appimage_src=""
          for candidate in \
            "src-tauri/target/release/bundle/appimage" \
            "target/release/bundle/appimage"; do
            if [[ -d "$candidate" ]]; then
              found="$(find "$candidate" -type f -name '*.AppImage' | head -n 1)"
              if [[ -n "$found" ]]; then
                appimage_src="$found"
                break
              fi
            fi
          done

          if [[ -z "$deb_src" ]]; then
            echo "::error::Missing Linux DEB artifact."
            exit 1
          fi
          if [[ -z "$appimage_src" ]]; then
            echo "::error::Missing Linux AppImage artifact."
            exit 1
          fi

          deb_out="$output_dir/ExoMind-${version}-linux-x64.deb"
          appimage_out="$output_dir/ExoMind-${version}-linux-x64.AppImage"
          cp "$deb_src" "$deb_out"
          cp "$appimage_src" "$appimage_out"

          echo "DEB_OUT=$deb_out" >> "$GITHUB_OUTPUT"
          echo "APPIMAGE_OUT=$appimage_out" >> "$GITHUB_OUTPUT"

      - name: Upload Linux assets to R2 (上传 Linux 产物到 R2)
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          bucket="exomind-releases"
          channel="${{ steps.r2meta.outputs.CHANNEL }}"
          version_dir="${{ steps.r2meta.outputs.VERSION_DIR }}"
          version="${{ steps.r2meta.outputs.VERSION }}"
          deb_out="${{ steps.normalize_linux.outputs.DEB_OUT }}"
          appimage_out="${{ steps.normalize_linux.outputs.APPIMAGE_OUT }}"

          npx wrangler r2 object put "${bucket}/${channel}/${version_dir}/ExoMind-${version}-linux-x64.deb" \
            --file "$deb_out" \
            --content-type "application/vnd.debian.binary-package" \
            --remote

          npx wrangler r2 object put "${bucket}/${channel}/${version_dir}/ExoMind-${version}-linux-x64.AppImage" \
            --file "$appimage_out" \
            --content-type "application/octet-stream" \
            --remote

      - name: Generate Linux manifest (生成 Linux 轻量 manifest 清单)
        id: manifest_linux
        shell: bash
        run: |
          set -euo pipefail

          channel="${{ steps.r2meta.outputs.CHANNEL }}"
          version="${{ steps.r2meta.outputs.VERSION }}"
          version_dir="${{ steps.r2meta.outputs.VERSION_DIR }}"
          deb_out="${{ steps.normalize_linux.outputs.DEB_OUT }}"
          appimage_out="${{ steps.normalize_linux.outputs.APPIMAGE_OUT }}"

          deb_size="$(wc -c < "$deb_out" | tr -d '[:space:]')"
          deb_sha256="$(sha256sum "$deb_out" | awk '{print $1}')"
          appimage_size="$(wc -c < "$appimage_out" | tr -d '[:space:]')"
          appimage_sha256="$(sha256sum "$appimage_out" | awk '{print $1}')"

          manifest_dir="artifacts/manifest"
          mkdir -p "$manifest_dir"
          manifest_path="$manifest_dir/linux-manifest.json"

          jq -n \
            --arg channel "$channel" \
            --arg version "$version" \
            --arg tag "$GITHUB_REF_NAME" \
            --arg deb_url "${channel}/${version_dir}/ExoMind-${version}-linux-x64.deb" \
            --argjson deb_size "$deb_size" \
            --arg deb_sha256 "$deb_sha256" \
            --arg appimage_url "${channel}/${version_dir}/ExoMind-${version}-linux-x64.AppImage" \
            --argjson appimage_size "$appimage_size" \
            --arg appimage_sha256 "$appimage_sha256" \
            '{
              channel: $channel,
              version: $version,
              tag: $tag,
              assets: {
                "linux-x64-deb": {
                  url: $deb_url,
                  size: $deb_size,
                  sha256: $deb_sha256
                },
                "linux-x64-appimage": {
                  url: $appimage_url,
                  size: $appimage_size,
                  sha256: $appimage_sha256
                }
              }
            }' > "$manifest_path"

          echo "PATH=$manifest_path" >> "$GITHUB_OUTPUT"
          echo "JSON=$(jq -c '.' "$manifest_path")" >> "$GITHUB_OUTPUT"

  build-android:
    outputs:
      manifest_json: ${{ steps.manifest_android.outputs.JSON }}
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_scope == 'all' || github.event.inputs.build_scope == 'android' }}
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ensure local Bun is available (确保本机 Bun 可用)
        shell: powershell
        run: |
          Write-Host "Install Bun via npm to enforce native Windows binary (通过 npm 强制使用 Windows 原生 Bun)..."
          npm install -g bun
          $npmPrefix = (npm config get prefix).Trim()
          if (-not $npmPrefix) {
            throw "npm prefix is empty; cannot locate global bun install path."
          }
          $env:Path = "$npmPrefix;$env:Path"
          "$npmPrefix" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $bunCmd = Get-Command bun -ErrorAction SilentlyContinue
          if (-not $bunCmd) {
            throw "Bun is unavailable after npm installation. Please ensure bun is installed and on PATH."
          }
          if ($bunCmd.Source -match '(?i)wsl|\\ubuntu\\') {
            throw "Detected WSL bun path: $($bunCmd.Source). Please use native Windows Bun."
          }
          Write-Host "Using Bun from: $($bunCmd.Source)"
          bun --version

      - name: Use local Rust toolchain (使用本机 Rust 工具链，禁止 WSL)
        shell: powershell
        run: |
          $preferredCargoHome = "D:\actions-runner\rust\cargo"
          $preferredRustupHome = "D:\actions-runner\rust\rustup"
          $preferredCargoBin = Join-Path $preferredCargoHome "bin"
          if (Test-Path $preferredCargoBin) {
            $env:CARGO_HOME = $preferredCargoHome
            $env:RUSTUP_HOME = $preferredRustupHome
            "CARGO_HOME=$preferredCargoHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "RUSTUP_HOME=$preferredRustupHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            $env:Path = "$preferredCargoBin;$env:Path"
            "$preferredCargoBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

          $cargoBin = Join-Path $env:USERPROFILE ".cargo\bin"
          if (Test-Path $cargoBin) {
            $env:Path = "$cargoBin;$env:Path"
            "$cargoBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

          $rustupCmd = Get-Command rustup -ErrorAction SilentlyContinue
          $rustcCmd = Get-Command rustc -ErrorAction SilentlyContinue
          $cargoCmd = Get-Command cargo -ErrorAction SilentlyContinue
          if ((-not $rustupCmd) -or (-not $rustcCmd) -or (-not $cargoCmd)) {
            throw "Rust toolchain not found on self-hosted Windows runner. Please pre-install rustup/cargo/rustc."
          }

          if (($rustupCmd.Source -match '(?i)wsl|\\ubuntu\\') -or ($rustcCmd.Source -match '(?i)wsl|\\ubuntu\\') -or ($cargoCmd.Source -match '(?i)wsl|\\ubuntu\\')) {
            throw "Detected Rust command from WSL path. Please use native Windows Rust toolchain."
          }

          rustup default stable
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to select stable Rust toolchain. Please install stable locally first (例如: rustup toolchain install stable)."
          }

          rustup show active-toolchain
          rustc -vV
          cargo -V

      - name: Configure local Android toolchain (配置本地 Android 工具链)
        shell: powershell
        run: |
          $defaultJavaHome = "C:\Program Files\Eclipse Adoptium\jdk-17.0.13.11-hotspot"
          $javaHome = $env:JAVA_HOME
          if (-not $javaHome -or -not (Test-Path $javaHome)) {
            if (-not (Test-Path $defaultJavaHome)) {
              throw "JAVA_HOME is invalid and default path not found: $defaultJavaHome"
            }
            $javaHome = $defaultJavaHome
          }
          "JAVA_HOME=$javaHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $javaBin = Join-Path $javaHome "bin"
          if (Test-Path $javaBin) {
            "$javaBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

          $defaultAndroidSdkRoot = "D:\data\AndroidSDK"
          $androidSdkRoot = $env:ANDROID_SDK_ROOT
          if (-not $androidSdkRoot -or -not (Test-Path $androidSdkRoot)) {
            if (-not (Test-Path $defaultAndroidSdkRoot)) {
              throw "ANDROID_SDK_ROOT is invalid and default path not found: $defaultAndroidSdkRoot"
            }
            $androidSdkRoot = $defaultAndroidSdkRoot
          }
          "ANDROID_SDK_ROOT=$androidSdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if (-not $env:ANDROID_HOME -or -not (Test-Path $env:ANDROID_HOME)) {
            "ANDROID_HOME=$androidSdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Validate Android signing secrets early (提前校验 Android 签名密钥)
        shell: powershell
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          foreach ($required in @("ANDROID_KEYSTORE_BASE64", "ANDROID_KEYSTORE_PASSWORD", "ANDROID_KEY_ALIAS", "ANDROID_KEY_PASSWORD")) {
            if (-not (Get-Item -Path "Env:$required" -ErrorAction SilentlyContinue)) {
              throw "Missing secret: $required"
            }
          }

      - name: Ensure Rust Android targets (确保 Rust Android 目标)
        shell: powershell
        run: rustup target add aarch64-linux-android i686-linux-android

      - name: Get short commit hash
        id: hash
        shell: powershell
        run: |
          $short = $env:GITHUB_SHA.Substring(0, 7)
          "HASH=$short" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Resolve app version (解析应用版本)
        id: app_version
        shell: powershell
        run: |
          $refName = "${{ github.ref_name }}"
          $appVersion = ""

          if ($refName.StartsWith("release/")) {
            $appVersion = $refName.Substring("release/".Length)
          } elseif ($refName.StartsWith("build/")) {
            $appVersion = $refName.Substring("build/".Length)
          }

          if (-not $appVersion) {
            $packageVersion = (Get-Content -Path "package.json" -Raw | ConvertFrom-Json).version
            $appVersion = [string]$packageVersion
          }

          if ($appVersion.StartsWith("v")) {
            $appVersion = $appVersion.Substring(1)
          }

          if (-not $appVersion) {
            throw "Cannot resolve app version from tag or package.json."
          }

          "APP_VERSION=$appVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Resolved app version: $appVersion"

      - name: Install dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          function Stop-ProcessTree([int]$RootPid) {
            $children = @(Get-CimInstance Win32_Process -Filter "ParentProcessId = $RootPid" -ErrorAction SilentlyContinue)
            foreach ($child in $children) {
              Stop-ProcessTree -RootPid $child.ProcessId
            }
            Stop-Process -Id $RootPid -Force -ErrorAction SilentlyContinue
          }

          function Clear-StaleBunProcesses() {
            $staleBun = @(Get-CimInstance Win32_Process -Filter "Name = 'bun.exe'" -ErrorAction SilentlyContinue | Where-Object { [string]::IsNullOrWhiteSpace($_.CommandLine) })
            foreach ($proc in $staleBun) {
              Write-Warning "Killing stale bun process PID=$($proc.ProcessId) (清理残留 bun 进程)"
              Stop-Process -Id $proc.ProcessId -Force -ErrorAction SilentlyContinue
            }

            $staleCmd = @(Get-CimInstance Win32_Process -Filter "Name = 'cmd.exe'" -ErrorAction SilentlyContinue | Where-Object { [string]::IsNullOrWhiteSpace($_.CommandLine) })
            foreach ($proc in $staleCmd) {
              Write-Warning "Killing stale cmd process PID=$($proc.ProcessId) (清理残留 cmd 进程)"
              Stop-Process -Id $proc.ProcessId -Force -ErrorAction SilentlyContinue
            }
          }

          function Invoke-BunInstallWithRetry([int]$TimeoutSeconds = 900, [int]$MaxAttempts = 2) {
            Clear-StaleBunProcesses
            for ($attempt = 1; $attempt -le $MaxAttempts; $attempt++) {
              Write-Host "bun install attempt $attempt/$MaxAttempts (安装依赖尝试 $attempt/$MaxAttempts)"
              Remove-Item -LiteralPath "node_modules/.bun-install.lock" -Force -ErrorAction SilentlyContinue

              $proc = Start-Process -FilePath "cmd.exe" -ArgumentList @("/c", "bun install --frozen-lockfile") -WorkingDirectory (Get-Location).Path -NoNewWindow -PassThru
              if (-not $proc.WaitForExit($TimeoutSeconds * 1000)) {
                Stop-ProcessTree -RootPid $proc.Id
                Clear-StaleBunProcesses
                Write-Warning "bun install timed out after $TimeoutSeconds seconds."
                if ($attempt -eq $MaxAttempts) {
                  throw "bun install exceeded timeout and all retries are exhausted."
                }
                continue
              }

              if ($proc.ExitCode -eq 0) {
                return
              }

              Write-Warning "bun install exited with code $($proc.ExitCode)."
              if ($attempt -eq $MaxAttempts) {
                throw "bun install failed after $MaxAttempts attempts."
              }
            }
          }

          Invoke-BunInstallWithRetry

      - name: Init Android
        run: bun tauri android init
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch Android audio permissions and release cleartext（注入音频权限与 release cleartext）
        shell: powershell
        run: |
          bun Scripts/dev/android-manifest-permission.ts

      - name: Verify Android permission and cleartext patch persisted（校验权限与 cleartext 配置）
        shell: powershell
        run: |
          $manifestPath = "src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          if (-not (Test-Path $manifestPath)) {
            throw "Manifest not found: $manifestPath"
          }
          foreach ($permission in @("android.permission.RECORD_AUDIO", "android.permission.MODIFY_AUDIO_SETTINGS")) {
            if (-not (Select-String -Path $manifestPath -Pattern $permission -SimpleMatch -Quiet)) {
              throw "Missing $permission in AndroidManifest.xml"
            }
          }

          $buildGradlePath = "src-tauri/gen/android/app/build.gradle.kts"
          if (-not (Test-Path $buildGradlePath)) {
            throw "Build gradle not found: $buildGradlePath"
          }
          $buildGradleContent = Get-Content -Path $buildGradlePath -Raw -Encoding UTF8
          $releaseCleartextPattern = 'getByName\("release"\)\s*\{[\s\S]*manifestPlaceholders\["usesCleartextTraffic"\]\s*=\s*"true"'
          if (-not ($buildGradleContent -match $releaseCleartextPattern)) {
            throw "Missing usesCleartextTraffic=true in release block."
          }

          Write-Host "Android permissions and cleartext release placeholder verified."

      - name: Build Android APK only (仅构建 APK，aarch64 + i686)
        run: bun tauri android build --ci --apk --split-per-abi -t aarch64 i686
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_APP_VERSION: ${{ steps.app_version.outputs.APP_VERSION }}
          VITE_BUILD_HASH: ${{ steps.hash.outputs.HASH }}
          HTTP_PROXY: http://127.0.0.1:7890
          HTTPS_PROXY: http://127.0.0.1:7890
          ALL_PROXY: http://127.0.0.1:7890
          NO_PROXY: localhost,127.0.0.1
          # Stabilize Kotlin/Gradle on Windows runners (稳定 Windows 上 Kotlin/Gradle 构建)
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dkotlin.compiler.execution.strategy=in-process -Dkotlin.incremental=false -Dhttp.proxyHost=127.0.0.1 -Dhttp.proxyPort=7890 -Dhttps.proxyHost=127.0.0.1 -Dhttps.proxyPort=7890

      - name: Validate Android app name/icon/artifact size (门禁校验)
        run: bun run check:android:meta
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Android signing keystore (准备签名密钥库)
        shell: powershell
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if (-not $env:ANDROID_KEYSTORE_BASE64) {
            throw "Missing secret: ANDROID_KEYSTORE_BASE64"
          }
          $keystorePath = Join-Path $env:RUNNER_TEMP "android-release.jks"
          try {
            $bytes = [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64)
          } catch {
            throw "ANDROID_KEYSTORE_BASE64 is not valid Base64."
          }
          [IO.File]::WriteAllBytes($keystorePath, $bytes)
          "ANDROID_KEYSTORE_PATH=$keystorePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Sign Android APK artifacts (签名 APK 产物)
        shell: powershell
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          foreach ($required in @("ANDROID_KEYSTORE_PATH", "ANDROID_KEYSTORE_PASSWORD", "ANDROID_KEY_ALIAS", "ANDROID_KEY_PASSWORD")) {
            if (-not (Get-Item -Path "Env:$required" -ErrorAction SilentlyContinue)) {
              throw "Missing secret: $required"
            }
          }

          $sdkRoot = if ($env:ANDROID_SDK_ROOT) { $env:ANDROID_SDK_ROOT } elseif ($env:ANDROID_HOME) { $env:ANDROID_HOME } else { $null }
          if (-not $sdkRoot) {
            throw "ANDROID_SDK_ROOT or ANDROID_HOME must be set."
          }

          $buildToolsRoot = Join-Path $sdkRoot "build-tools"
          $buildToolsDir = Get-ChildItem -Path $buildToolsRoot -Directory | Sort-Object { [Version]$_.Name } | Select-Object -Last 1
          if (-not $buildToolsDir) {
            throw "No Android build-tools directory found under $buildToolsRoot"
          }

          $zipalign = Join-Path $buildToolsDir.FullName "zipalign.exe"
          $apksigner = Join-Path $buildToolsDir.FullName "apksigner.bat"
          if ((-not (Test-Path $zipalign)) -or (-not (Test-Path $apksigner))) {
            throw "zipalign.exe or apksigner.bat not found under $($buildToolsDir.FullName)"
          }

          $signedApkDir = "src-tauri/gen/android/app/build/outputs/apk-signed"
          New-Item -Path $signedApkDir -ItemType Directory -Force | Out-Null

          $apkFiles = Get-ChildItem -Path "src-tauri/gen/android/app/build/outputs/apk" -Recurse -Filter "*release*.apk" | Where-Object { $_.Name -notlike "*-signed.apk" }
          if (-not $apkFiles -or $apkFiles.Count -eq 0) {
            throw "No release APK files found."
          }

          foreach ($apk in $apkFiles) {
            $baseName = [IO.Path]::GetFileNameWithoutExtension($apk.Name)
            $alignedApk = Join-Path $env:RUNNER_TEMP "$baseName-aligned.apk"
            $signedApk = Join-Path $signedApkDir "$baseName-signed.apk"

            & $zipalign -p -f 4 $apk.FullName $alignedApk
            if ($LASTEXITCODE -ne 0) {
              throw "zipalign failed: $($apk.FullName)"
            }

            & $apksigner sign `
              --ks $env:ANDROID_KEYSTORE_PATH `
              --ks-pass ("pass:{0}" -f $env:ANDROID_KEYSTORE_PASSWORD) `
              --ks-key-alias $env:ANDROID_KEY_ALIAS `
              --key-pass ("pass:{0}" -f $env:ANDROID_KEY_PASSWORD) `
              --out $signedApk `
              $alignedApk
            if ($LASTEXITCODE -ne 0) {
              throw "apksigner sign failed: $($apk.FullName)"
            }

            & $apksigner verify --verbose $signedApk
            if ($LASTEXITCODE -ne 0) {
              throw "apksigner verify failed: $signedApk"
            }
            Write-Host "Signed APK: $signedApk"
          }

      - name: Resolve R2 channel and version (解析 R2 通道与版本)
        id: r2meta
        shell: powershell
        run: |
          $tagName = "${{ github.ref_name }}"
          if ($tagName.StartsWith("release/")) {
            $channel = "release"
            $version = $tagName.Substring("release/".Length)
          } elseif ($tagName.StartsWith("build/")) {
            $channel = "preview"
            $version = $tagName.Substring("build/".Length)
          } else {
            throw "Unsupported tag format: $tagName"
          }

          "CHANNEL=$channel" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "VERSION_DIR=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Normalize Android assets for R2 (整理 Android 产物并规范命名)
        id: normalize_android
        shell: powershell
        run: |
          $version = "${{ steps.r2meta.outputs.VERSION }}"
          $signedApkDir = "src-tauri/gen/android/app/build/outputs/apk-signed"
          $outputDir = "artifacts/r2-upload/android"
          New-Item -Path $outputDir -ItemType Directory -Force | Out-Null

          $apkFiles = Get-ChildItem -Path $signedApkDir -Recurse -File -Filter *.apk
          if (-not $apkFiles -or $apkFiles.Count -eq 0) {
            throw "No signed APK artifacts found under: $signedApkDir"
          }

          $arm64Apk = $null
          $x86Apk = $null
          foreach ($apk in $apkFiles) {
            $name = $apk.Name.ToLowerInvariant()
            if (-not $arm64Apk -and ($name -match "arm64|aarch64|arm64-v8a")) {
              $arm64Apk = $apk
              continue
            }
            if (-not $x86Apk -and ($name -match "i686|x86") -and ($name -notmatch "x86_64")) {
              $x86Apk = $apk
            }
          }

          if (-not $arm64Apk) {
            throw "Missing Android arm64 signed APK artifact."
          }
          if (-not $x86Apk) {
            throw "Missing Android x86 signed APK artifact."
          }

          $arm64Out = Join-Path $outputDir "ExoMind-$version-android-arm64.apk"
          $x86Out = Join-Path $outputDir "ExoMind-$version-android-x86.apk"
          Copy-Item -Path $arm64Apk.FullName -Destination $arm64Out -Force
          Copy-Item -Path $x86Apk.FullName -Destination $x86Out -Force

          "ARM64_OUT=$arm64Out" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "X86_OUT=$x86Out" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload Android assets to R2 (上传 Android 产物到 R2)
        shell: powershell
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          function Upload-R2File([string]$FilePath, [string]$ObjectKey, [string]$ContentType) {
            if (-not (Test-Path $FilePath)) {
              throw "File not found: $FilePath"
            }
            $bucket = "exomind-releases"
            Write-Host "Uploading $FilePath -> $ObjectKey"
            npx wrangler r2 object put "$bucket/$ObjectKey" --file "$FilePath" --content-type "$ContentType" --remote
            if ($LASTEXITCODE -ne 0) {
              throw "Upload failed for $FilePath"
            }
          }

          $channel = "${{ steps.r2meta.outputs.CHANNEL }}"
          $version = "${{ steps.r2meta.outputs.VERSION }}"
          $versionDir = "${{ steps.r2meta.outputs.VERSION_DIR }}"
          $arm64Path = "${{ steps.normalize_android.outputs.ARM64_OUT }}"
          $x86Path = "${{ steps.normalize_android.outputs.X86_OUT }}"

          Upload-R2File -FilePath $arm64Path -ObjectKey "$channel/$versionDir/ExoMind-$version-android-arm64.apk" -ContentType "application/vnd.android.package-archive"
          Upload-R2File -FilePath $x86Path -ObjectKey "$channel/$versionDir/ExoMind-$version-android-x86.apk" -ContentType "application/vnd.android.package-archive"

      - name: Generate Android manifest (生成 Android 轻量 manifest 清单)
        id: manifest_android
        shell: powershell
        run: |
          function New-AssetEntry([string]$RelativeUrl, [string]$FilePath) {
            $size = (Get-Item -LiteralPath $FilePath).Length
            $sha256 = (Get-FileHash -Algorithm SHA256 -Path $FilePath).Hash.ToLowerInvariant()
            return @{
              url = $RelativeUrl
              size = $size
              sha256 = $sha256
            }
          }

          $channel = "${{ steps.r2meta.outputs.CHANNEL }}"
          $version = "${{ steps.r2meta.outputs.VERSION }}"
          $versionDir = "${{ steps.r2meta.outputs.VERSION_DIR }}"
          $arm64Path = "${{ steps.normalize_android.outputs.ARM64_OUT }}"
          $x86Path = "${{ steps.normalize_android.outputs.X86_OUT }}"
          $manifestDir = "artifacts/manifest"
          New-Item -Path $manifestDir -ItemType Directory -Force | Out-Null

          $assets = @{
            "android-arm64" = (New-AssetEntry -RelativeUrl "$channel/$versionDir/ExoMind-$version-android-arm64.apk" -FilePath $arm64Path)
            "android-x86" = (New-AssetEntry -RelativeUrl "$channel/$versionDir/ExoMind-$version-android-x86.apk" -FilePath $x86Path)
          }

          $manifest = @{
            channel = $channel
            version = $version
            tag = "${{ github.ref_name }}"
            assets = $assets
          }
          $manifestPath = Join-Path $manifestDir "android-manifest.json"
          $manifest | ConvertTo-Json -Depth 12 | Set-Content -Path $manifestPath -Encoding UTF8
          $manifestJson = $manifest | ConvertTo-Json -Depth 12 -Compress
          "PATH=$manifestPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "JSON=$manifestJson" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

  create-release:
    needs: [build-windows, build-macos, build-linux, build-android]
    runs-on: ubuntu-latest
    # 对 release/* 和 build/* tag 执行发布步骤，要求全平台构建成功
    if: |
      always() &&
      (
        startsWith(github.ref, 'refs/tags/release/') ||
        startsWith(github.ref, 'refs/tags/build/')
      ) &&
      needs.build-windows.result == 'success' &&
      needs.build-macos.result == 'success' &&
      needs.build-linux.result == 'success' &&
      needs.build-android.result == 'success'
    steps:
      - name: Materialize platform manifests from job outputs (从 job 输出落盘平台 manifest)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-manifests
          cat <<'JSON' > release-manifests/windows-manifest.json
          ${{ needs.build-windows.outputs.manifest_json }}
          JSON
          cat <<'JSON' > release-manifests/macos-manifest.json
          ${{ needs.build-macos.outputs.manifest_json }}
          JSON
          cat <<'JSON' > release-manifests/linux-manifest.json
          ${{ needs.build-linux.outputs.manifest_json }}
          JSON
          cat <<'JSON' > release-manifests/android-manifest.json
          ${{ needs.build-android.outputs.manifest_json }}
          JSON

          for file in release-manifests/*.json; do
            if [[ ! -s "$file" ]]; then
              echo "::error::Manifest file is empty: $file"
              exit 1
            fi
            jq -e . "$file" >/dev/null
          done

          ls -la release-manifests/

      - name: Resolve release metadata (解析发布元信息)
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          ref_name="${GITHUB_REF_NAME}"
          version=""
          storage_channel=""

          if [[ "$ref_name" == build/* ]]; then
            version="${ref_name#build/}"
            storage_channel="preview"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "title=Pre-release $version" >> "$GITHUB_OUTPUT"
          else
            version="${ref_name#release/}"
            storage_channel="release"
            lower_version="$(echo "$version" | tr '[:upper:]' '[:lower:]')"
            channel=""
            if [[ "$lower_version" == *"-alpha."* ]]; then
              channel="Alpha"
            elif [[ "$lower_version" == *"-beta."* ]]; then
              channel="Beta"
            elif [[ "$lower_version" == *"-rc."* ]]; then
              channel="RC"
            elif [[ "$lower_version" == *"-preview."* ]]; then
              channel="Preview"
            fi

            if [[ -n "$channel" ]]; then
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
              echo "title=$channel $version" >> "$GITHUB_OUTPUT"
            else
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
              echo "title=Release $version" >> "$GITHUB_OUTPUT"
            fi
          fi

          if [[ -z "$version" || -z "$storage_channel" ]]; then
            echo "::error::Cannot resolve release metadata from ref: $ref_name"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "storage_channel=$storage_channel" >> "$GITHUB_OUTPUT"
          echo "version_dir=$version" >> "$GITHUB_OUTPUT"

      - name: Merge manifests and generate latest.json (合并清单并生成 latest.json)
        id: latest
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          version="${{ steps.meta.outputs.version }}"
          manifest_files=(release-manifests/*.json)
          if (( ${#manifest_files[@]} == 0 )); then
            echo "::error::No manifest files found."
            exit 1
          fi

          assets_json="$(jq -s 'reduce .[] as $item ({}; . + ($item.assets // {}))' "${manifest_files[@]}")"
          published_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          jq -n \
            --arg version "$version" \
            --arg tag "$GITHUB_REF_NAME" \
            --arg published_at "$published_at" \
            --argjson assets "$assets_json" \
            '{version: $version, tag: $tag, published_at: $published_at, assets: $assets}' > latest.json

          required_keys=(
            "windows-x64-setup"
            "android-arm64"
            "android-x86"
            "linux-x64-appimage"
            "linux-x64-deb"
          )

          missing_keys=()
          for key in "${required_keys[@]}"; do
            if ! jq -e --arg k "$key" '.assets[$k] != null' latest.json >/dev/null; then
              missing_keys+=("$key")
            fi
          done
          if (( ${#missing_keys[@]} > 0 )); then
            echo "::error::Missing required asset keys: ${missing_keys[*]}"
            cat latest.json
            exit 1
          fi

          if ! jq -e '.assets["macos-aarch64"] != null or .assets["macos-x64"] != null' latest.json >/dev/null; then
            echo "::error::Missing macOS asset key: expected one of macos-aarch64 / macos-x64"
            cat latest.json
            exit 1
          fi

          echo "PATH=latest.json" >> "$GITHUB_OUTPUT"

      - name: Upload latest.json to R2 (上传 latest.json 到 R2)
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          bucket="exomind-releases"
          storage_channel="${{ steps.meta.outputs.storage_channel }}"
          npx wrangler r2 object put "${bucket}/${storage_channel}/latest.json" \
            --file latest.json \
            --content-type "application/json" \
            --remote

      - name: Update versions.json and cleanup old previews (更新预发布版本列表并清理旧版本)
        if: steps.meta.outputs.storage_channel == 'preview'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          channel="${{ steps.meta.outputs.storage_channel }}"
          version="${{ steps.meta.outputs.version }}"
          version_dir="${{ steps.meta.outputs.version_dir }}"
          tag_name="${GITHUB_REF_NAME}"
          bucket="exomind-releases"
          published_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          max_versions=15

          existing_versions="[]"
          if npx wrangler r2 object get "${bucket}/${channel}/versions.json" --file existing-versions.json --remote 2>/dev/null; then
            existing_payload="$(cat existing-versions.json)"
            if echo "$existing_payload" | jq -e 'type == "array"' >/dev/null 2>&1; then
              existing_versions="$existing_payload"
            else
              existing_versions="$(echo "$existing_payload" | jq '.versions // []')"
              configured_retention="$(echo "$existing_payload" | jq -r '.retention // empty')"
              if [[ "$configured_retention" =~ ^[0-9]+$ ]] && (( configured_retention > 0 )); then
                max_versions="$configured_retention"
              fi
            fi
          fi

          new_entry="$(jq -n \
            --arg version "$version" \
            --arg tag "$tag_name" \
            --arg published_at "$published_at" \
            --arg version_dir "$version_dir" \
            '{version: $version, tag: $tag, published_at: $published_at, version_dir: $version_dir}')"

          updated_versions="$(echo "$existing_versions" | jq \
            --argjson entry "$new_entry" \
            '[$entry] + . | unique_by(.version)')"

          total="$(echo "$updated_versions" | jq 'length')"
          if (( total > max_versions )); then
            old_versions="$(echo "$updated_versions" | jq -r ".[$max_versions:][].version_dir")"
            updated_versions="$(echo "$updated_versions" | jq ".[:$max_versions]")"

            for old_dir in $old_versions; do
              echo "Cleaning up old preview: ${channel}/${old_dir}/"
              list_output="$(npx wrangler r2 object list "${bucket}" --prefix "${channel}/${old_dir}/" --remote 2>&1)" || true
              objects="$(echo "$list_output" | jq -r '.[].key' 2>/dev/null)" || objects=""
              count=$(echo "$objects" | grep -c . || true)
              echo "  Found $count object(s) to delete"
              deleted=0
              for obj in $objects; do
                if npx wrangler r2 object delete "${bucket}/${obj}" --remote 2>/dev/null; then
                  deleted=$((deleted + 1))
                else
                  echo "  WARNING: Failed to delete $obj"
                fi
              done
              echo "  Cleanup complete: $deleted/$count deleted"
            done
          fi

          kept_total="$(echo "$updated_versions" | jq 'length')"
          updated_json="$(jq -n \
            --argjson versions "$updated_versions" \
            --argjson retention "$max_versions" \
            '{versions: $versions, retention: $retention}')"

          echo "$updated_json" | jq '.' > versions.json
          echo "=== versions.json (input=${total}, kept=${kept_total}, retention=${max_versions}) ==="
          cat versions.json

          npx wrangler r2 object put "${bucket}/${channel}/versions.json" \
            --file versions.json \
            --content-type "application/json" \
            --remote

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: latest.json
          # 从 tag 名称提取版本号 (去掉 release/ 前缀)
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.meta.outputs.title }}
          draft: false
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
