[package]
name = "exomind-runtime"
version = "0.1.0"
edition = "2024"
default-run = "exomind-rt"

[[bin]]
name = "exomind-rt"
path = "src/main.rs"

[[bin]]
name = "fake-claude-cli"
path = "tests/bin/fake-claude-cli.rs"

[[bin]]
name = "fake-codex-cli"
path = "tests/bin/fake-codex-cli.rs"

[dependencies]
anyhow = "1"
axum = "0.7"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "process", "sync", "signal"] }
thiserror = "1"
sysinfo = { version = "0.30", default-features = false }
tower-http = { version = "0.6", features = ["cors"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
mdns-sd = "0.11"
sha2 = "0.10"
percent-encoding = "2"
rand = "0.8"
base64 = "0.22"
async-stream = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }

# PTY support: not available on Android (portable-pty → termios → no android impl)
[target.'cfg(not(target_os = "android"))'.dependencies]
portable-pty = "0.8"
dirs = "5"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
tracing-subscriber = { version = "0.3", features = ["fmt"] }
