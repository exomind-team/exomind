                'exact_correction_http_read_is_scoped_and_returns_null_only_for_absence',
              ],
            },
          ];
          const summary = [];
          process.on('exit', () => {
            writeFileSync(join(evidence, 'cargo-regressions.json'), JSON.stringify(summary, null, 2) + '\n');
          });
          const compileArgs = ['test', '--locked', '-p', 'exomind-core', '--tests', '--no-run'];
          const compile = spawnSync('cargo', compileArgs, {
            cwd: process.cwd(), env: { ...process.env, CARGO_TERM_COLOR: 'never' },
            encoding: 'utf8', timeout: 600000, maxBuffer: 32 * 1024 * 1024, windowsHide: true,
          });
          writeFileSync(join(evidence, 'core-integration-tests-compile-only.stdout'), compile.stdout ?? '', { flag: 'wx' });
          writeFileSync(join(evidence, 'core-integration-tests-compile-only.stderr'), [
            compile.stderr ?? '',
            compile.error ? compile.error.name + ': ' + compile.error.message + '\n' : '',
          ].join(''), { flag: 'wx' });
          summary.push({
            name: 'core-integration-tests-compile-only',
            status: compile.status,
            error: compile.error ? compile.error.message : null,
          });
          assert.equal(compile.error, undefined, 'Core integration compile-only command did not start or timed out');
          assert.equal(compile.status, 0, 'Core integration compile-only gate failed');
          for (const item of cases) {
            const env = { ...process.env, CARGO_TERM_COLOR: 'never' };
            if (item.fixture === 'core8') env.EXOMIND_CORE_SCHEMA8_FIXTURE = core8Fixture;
            if (item.fixture === 'core10') {
              env.EXOMIND_CORE_SCHEMA10_FIXTURE = core10Fixture;
              env.EXOMIND_PREFREEZE_FIXTURE_DIR = core10Fixture;
            }
            const result = spawnSync('cargo', item.args, {
              cwd: process.cwd(), env, encoding: 'utf8', timeout: 600000,
              maxBuffer: 32 * 1024 * 1024, windowsHide: true,
            });
            const stdout = result.stdout ?? '';
            const stderr = [result.stderr ?? '', result.error ? `${result.error.name}: ${result.error.message}\n` : ''].join('');
            writeFileSync(join(evidence, `${item.name}.stdout`), stdout, { flag: 'wx' });
            writeFileSync(join(evidence, `${item.name}.stderr`), stderr, { flag: 'wx' });
            assert.equal(result.error, undefined, `${item.name} did not start or timed out; see external evidence`);
            assert.equal(result.status, 0, `${item.name} failed; see external evidence`);
            const results = [...stdout.matchAll(/^test result: ok\. (\d+) passed; (\d+) failed; (\d+) ignored; .*$/gm)];
            assert.equal(results.length, 1, `${item.name} did not produce one test result`);
            assert.ok(Number(results[0][1]) > 0, `${item.name} ran zero tests`);
            assert.equal(Number(results[0][2]), 0, `${item.name} reported failed tests`);
            assert.equal(Number(results[0][3]), 0, `${item.name} left selected tests ignored`);
            const passedNames = stdout.split(/\r?\n/).filter(line => line.startsWith('test ') && line.endsWith(' ... ok'));
            for (const expected of item.expected) assert.ok(passedNames.some(line => line.includes(expected)), `${item.name} did not run its named contract: ${expected}`);
            assert.ok(Number(results[0][1]) >= item.expected.length, `${item.name} ran fewer tests than its explicit contract set`);
            summary.push({ name: item.name, passed: Number(results[0][1]), expected: item.expected });
          }
          writeFileSync(join(evidence, 'cargo-regressions.json'), JSON.stringify(summary, null, 2), { flag: 'wx' });
          process.stdout.write(`${summary.map(item => item.passed === undefined ? `${item.name}: compiled` : `${item.name}: ${item.passed} passed`).join('\n')}\n`);
          NODE
      - name: Install pinned Agent-spec CLI
        run: cargo install agent-spec --version 1.4.0 --locked
      - name: Run source contracts and explicit UI regressions
        shell: bash
        run: |
          args=(--out "$CONTRACT_OUT")
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            args+=(--base "$BASE_SHA")
          fi
          bun run verify:beta:contracts "${args[@]}"
      - name: Retain proof on success or failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: beta-source-contracts-${{ github.sha }}
          path: |
            ${{ runner.temp }}/exomind-contract-evidence
            ${{ runner.temp }}/exomind-contract-evidence-originals.json
            ${{ runner.temp }}/exomind-core10-lifecycle-evidence
            ${{ runner.temp }}/exomind-core8-evidence
          if-no-files-found: warn
          retention-days: 7
