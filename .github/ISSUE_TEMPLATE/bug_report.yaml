name: Bug Report
description: 报告 ExoMind 的 bug
title: "[Bug]: "
labels: ["bug"]
body:

- type: markdown
  attributes:
    value: |
      ## 🐛 Bug 报告

      感谢你发现 bug！请填写以下信息帮助我们快速定位和修复问题。

      > **注意**：安全相关漏洞请通过私密渠道报告。

- type: textarea
  id: description
  attributes:
    label: 📝 问题描述
    description: 请简洁描述你遇到的问题
    placeholder: 例如：点击暂停按钮后应用崩溃
  validations:
    required: true

- type: textarea
  id: steps
  attributes:
    label: 🔄 复现步骤
    description: 详细描述如何复现这个 bug（一步一步）
    placeholder: |
      1. 打开应用
      2. 进入冥想页面
      3. 开始倒计时
      4. 点击暂停按钮
      5. ...
  validations:
    required: true

- type: textarea
  id: expected
  attributes:
    label: ✅ 期望行为
    description: 你期望程序应该如何工作？
    placeholder: 点击暂停后，倒计时应该停止，事件应该被记录
  validations:
    required: true

- type: textarea
  id: actual
  attributes:
    label: ❌ 实际行为
    description: 程序实际做了什么？
    placeholder: 点击暂停后，应用崩溃/无响应/事件未记录
  validations:
    required: true

- type: textarea
  id: logs
  attributes:
    label: 📋 日志输出
    description: 复制控制台日志或终端输出（如果有）
    placeholder: |
      ```
      [Error] Uncaught TypeError: ...
      at handlePauseClick (EventPage.tsx:42)
      ...
      ```
  validations:
    required: false

- type: file
  id: screenshot
  attributes:
    label: 🖼️ 截图/录屏
    description: 上传问题截图或录屏（.png, .mp4）
  validations:
    required: false

- type: input
  id: version
  attributes:
    label: 🔢 版本号
    description: ExoMind 版本（设置 → 关于 或终端执行 `git describe --tags`）
    placeholder: 例如：v0.1.0 或 commit hash
  validations:
    required: true

- type: dropdown
  id: platform
  attributes:
    label: 💻 平台
    description: 你在什么设备/系统上运行？
    options:
      - Windows
      - macOS
      - Linux
      - Android
      - iOS
      - Web (浏览器)
  validations:
    required: false

- type: textarea
  id: additional
  attributes:
    label: 📎 附加信息
    description: 其他有助于理解问题的信息（环境、重现频率等）
    placeholder: |
      - 环境：Windows 11, 16GB RAM
      - 重现频率：每次必现 / 偶发(1/10)
      - 相关设置：...
  validations:
    required: false
