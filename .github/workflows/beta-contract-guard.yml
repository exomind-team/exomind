name: Beta Source Contracts

# Source proof only. This neither builds nor publishes a Beta candidate.
on:
  workflow_dispatch:
  push:
    branches: [dev, dev-0.6]
    paths: &contract_paths
      - '.agent-spec/config.yaml'
      - '.github/workflows/beta-contract-guard.yml'
      - 'knowledge/**'
      - 'specs/**'
      - 'scripts/dev/beta-contract-*.ts'
      - 'scripts/dev/beta-build-request.ts'
      - 'scripts/dev/beta-patch-preflight.mjs'
      - 'scripts/dev/beta-apk-identity.mjs'
      - 'tests/unit/scripts/beta-apk-identity.test.mjs'
      - 'tests/unit/scripts/beta-patch-preflight.test.mjs'
      - 'docs/development/beta-core8-migration-fixture.md'
      - 'tests/fixtures/beta/**'
      - 'tests/unit/scripts/beta-core8-fixture.test.ts'
      - 'tests/unit/scripts/beta-core10-fixture*.test.ts'
      - 'scripts/dev/beta-core8-fixture.ts'
      - 'scripts/dev/beta-core-fixture-source.ts'
      - 'scripts/dev/beta-core10-fixture.ts'
      - 'docs/development/beta-core10-migration-fixture.md'
      - 'tests/unit/scripts/beta-contract-*.test.ts'
      - 'tests/unit/scripts/beta-build-request.test.ts'
      - 'crates/exomind-beta-host/**'
      - 'crates/exomind-core/**'
      - 'Cargo.toml'
      - 'src-tauri/src/beta*'
      - 'src-tauri/tauri.beta.conf.json'
      - 'src/beta/**'
      - 'src/ui/app/components/**'
      - 'src/components/ui/**'
      - 'vitest.config.ts'
      - 'tailwind.config.js'
      - 'src/index.css'
      - 'tests/setup.ts'
      - 'scripts/dev/supervised-command*'
      - 'tests/unit/beta/**'
      - 'package.json'
      - 'bun.lock'
      - 'Cargo.lock'
  pull_request:
    paths: *contract_paths

permissions:
  contents: read

concurrency:
  group: beta-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-contracts:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_DEV_INCREMENTAL: 'false'
      CARGO_PROFILE_DEV_CODEGEN_UNITS: '16'
      # Env values are passed as argv, never interpolated into a shell program.
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'
      - uses: dtolnay/rust-toolchain@stable
      # runner.* is unavailable in jobs.<id>.env during workflow admission.
      - name: Set external evidence and reusable cache paths
        shell: bash
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/exomind-contract-cache" >> "$GITHUB_ENV"
          echo "CONTRACT_OUT=$RUNNER_TEMP/exomind-contract-evidence" >> "$GITHUB_ENV"
          echo "CORE8_EVIDENCE=$RUNNER_TEMP/exomind-core8-evidence" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/exomind-core8-evidence"
          CORE10_EVIDENCE="$RUNNER_TEMP/exomind-core10-lifecycle-evidence"
          if [[ -e "$CORE10_EVIDENCE" ]]; then
            echo "Core10 evidence directory already exists: $CORE10_EVIDENCE" >&2
            exit 1
          fi
          mkdir -p "$CORE10_EVIDENCE"
          echo "CORE10_EVIDENCE=$CORE10_EVIDENCE" >> "$GITHUB_ENV"
      - name: Install frozen frontend dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Run bounded 15-file Beta regressions
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { spawnSync } from 'node:child_process';
          import { readFileSync, statSync, writeFileSync } from 'node:fs';
          import { join, relative, resolve } from 'node:path';

          const root = process.cwd();
          const evidence = process.env.CORE8_EVIDENCE;
          assert.ok(evidence, 'CORE8_EVIDENCE must name an external evidence directory');
          const featureTests = [
            'tests/unit/beta/audio-recording.test.ts',
            'tests/unit/beta/audio-recording-ui.test.tsx',
            'tests/unit/beta/period-window.test.ts',
            'tests/unit/beta/period-client.test.ts',
            'tests/unit/beta/period-timeline.test.tsx',
            'tests/unit/beta/correction-source-client.test.ts',
            'tests/unit/beta/summary-source-dialog.test.tsx',
            'tests/unit/beta/summary-validation.test.ts',
            'tests/unit/beta/external-summary.test.tsx',
            'tests/unit/beta/summary-feed.test.tsx',
            'tests/unit/beta/record-correction-owner.test.ts',
            'tests/unit/beta/record-organization-client.test.ts',
            'tests/unit/beta/record-organization-drafts.test.ts',
            'tests/unit/beta/record-workspace-integration.test.tsx',
            'tests/unit/beta/original-drafts.test.ts',
          ];

          function runVitest(name, files, expectedTestCount) {
            for (const file of files) {
              const stats = statSync(resolve(root, file), { throwIfNoEntry: false });
              assert.ok(stats?.isFile() && stats.size > 0, `Missing or empty test file: ${file}`);
            }
            const reportPath = join(evidence, `${name}.json`);
            const result = spawnSync(process.execPath, [
              'node_modules/vitest/vitest.mjs', 'run', ...files,
              '--maxWorkers=1', '--reporter=json', `--outputFile=${reportPath}`,
            ], { cwd: root, encoding: 'utf8', timeout: 600000, maxBuffer: 32 * 1024 * 1024, windowsHide: true });
            writeFileSync(join(evidence, `${name}.stdout`), result.stdout ?? '', { flag: 'wx' });
            writeFileSync(join(evidence, `${name}.stderr`), [result.stderr ?? '', result.error ? `${result.error.name}: ${result.error.message}\n` : ''].join(''), { flag: 'wx' });
            assert.equal(result.error, undefined, `${name} process failed; see external evidence`);
            assert.equal(result.status, 0, `${name} failed; see external evidence`);

            const report = JSON.parse(readFileSync(reportPath, 'utf8'));
            assert.equal(report.success, true, `${name} did not report success`);
            assert.equal(report.numFailedTests, 0, `${name} has failing assertions`);
            assert.equal(report.numPendingTests, 0, `${name} has skipped or pending assertions`);
            assert.equal(report.numTodoTests, 0, `${name} has todo assertions`);
            assert.ok(report.numTotalTests > 0, `${name} executed no assertions`);
            assert.equal(report.numPassedTests, report.numTotalTests, `${name} did not pass every assertion`);
            if (expectedTestCount !== undefined) assert.equal(report.numPassedTests, expectedTestCount, `${name} changed its expected assertion count`);
            assert.equal(report.testResults.length, files.length, `${name} did not execute every selected file`);

            const seen = new Set();
            for (const fileResult of report.testResults) {
              const path = relative(root, fileResult.name).replaceAll('\\', '/');
              assert.ok(files.includes(path), `${name} reported an unexpected file: ${path}`);
              assert.ok(!seen.has(path), `${name} reported a duplicate file: ${path}`);
              seen.add(path);
              assert.equal(fileResult.status, 'passed', `${path} did not pass`);
              assert.ok(fileResult.assertionResults.length > 0, `${path} contained no assertions`);
              assert.ok(fileResult.assertionResults.every(test => test.status === 'passed'), `${path} contains a skipped or failed assertion`);
            }
            assert.deepEqual([...seen].sort(), [...files].sort(), `${name} file coverage changed`);
            process.stdout.write(`${name}: ${report.numPassedTests} passed across ${seen.size} files\n`);
          }

          runVitest('beta-core8-related-feature-regressions', featureTests);
          NODE
      - name: Check read-only patch intake
        run: node --test --test-concurrency=1 tests/unit/scripts/beta-patch-preflight.test.mjs tests/unit/scripts/beta-apk-identity.test.mjs
      - name: Check evidence rejection rules
        run: bun run test:beta:contract-evidence
      - name: Check original diagnostics and candidate identity
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { existsSync, readFileSync } from 'node:fs';
          import { relative } from 'node:path';
          const files = [
            'tests/unit/beta/profile-switch-guard.test.ts',
            'tests/unit/beta/message-actions.test.tsx',
            'tests/unit/beta/message-references.test.ts',
            'tests/unit/beta/agent-grants-client.test.ts',
            'tests/unit/beta/agent-grants-state.test.ts',
            'tests/unit/beta/agent-grants-panel.test.tsx',
            'tests/unit/beta/settings-diagnostics-agent-grants.integration.test.tsx',
            'tests/unit/beta/beta-message-locator.test.ts',
            'tests/unit/beta/message-integration.test.tsx',
            'tests/unit/beta/diagnostics-client.test.ts',
            'tests/unit/beta/diagnostics-state.test.ts',
            'tests/unit/beta/original-lifecycle-client.test.ts',
            'tests/unit/beta/original-lifecycle-state.test.ts',
            'tests/unit/beta/original-lifecycle-panel.test.tsx',
            'tests/unit/beta/original-lifecycle-restore-retry.test.tsx',
            'tests/unit/beta/control-color-contract.test.tsx',
            'tests/unit/beta/diagnostics-panel.test.tsx',
            'tests/unit/beta/diagnostics-settings.test.tsx',
            'tests/unit/beta/last-profile-ui.test.tsx',
            'tests/unit/beta/original-acquisition.test.ts',
            'tests/unit/beta/original-auto-diagnostics.test.ts',
            'tests/unit/beta/original-transfer-diagnostics-ui.test.tsx',
            'tests/unit/beta/original-export-recovery.test.tsx',
            'tests/unit/scripts/beta-build-request.test.ts',
            'tests/unit/scripts/beta-core8-fixture.test.ts',
            'tests/unit/scripts/beta-core10-fixture.test.ts',
            'tests/unit/scripts/beta-core10-fixture-execution.test.ts',
          ];
          assert.ok(process.env.CONTRACT_OUT);
          assert.equal(existsSync(process.env.CONTRACT_OUT), false, 'The source gate owns its new evidence directory');
          const reportPath = process.env.CONTRACT_OUT + '-originals.json';
          execFileSync(process.execPath, [
            'node_modules/vitest/vitest.mjs', 'run', ...files, '--maxWorkers=1',
            '--reporter=json', `--outputFile=${reportPath}`,
          ], { timeout: 120000, stdio: 'inherit' });
          const report = JSON.parse(readFileSync(reportPath, 'utf8'));
          assert.equal(existsSync(process.env.CONTRACT_OUT), false, 'Diagnostic tests must not create the source gate evidence directory');
          assert.equal(report.success, true);
          assert.ok(report.numTotalTests > 0);
          assert.equal(report.numFailedTests, 0);
          assert.equal(report.numPendingTests, 0);
          assert.equal(report.numTodoTests, 0);
          assert.equal(report.numPassedTests, report.numTotalTests);
          assert.equal(report.testResults.length, files.length);
          assert.deepEqual(report.testResults.map(result => relative(process.cwd(), result.name).replaceAll('\\', '/')).sort(), [...files].sort());
          for (const result of report.testResults) {
            assert.equal(result.status, 'passed');
            assert.ok(result.assertionResults.length > 0);
            assert.ok(result.assertionResults.every(test => test.status === 'passed'));
          }
          NODE
      - name: Check diagnostic bounds and signed-origin recovery
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          const cases = [
            ['-p', 'exomind-beta-host', '--lib', 'diagnostics::'],
            ['-p', 'exomind-beta-host', '--lib', 'pre_epoch_sample_returns_clock_unavailable_without_changing_epoch_or_elapsed_domain'],
            ['-p', 'exomind-beta-host', '--lib', 'unix_epoch_is_a_valid_zero_wall_sample'],
            ['-p', 'exomind-beta-host', '--lib', 'original_auto_queue_status_reads_without_changing_policy_or_transfer_state'],
            ['-p', 'exomind-beta-host', '--test', 'native_export_journal'],
            ['-p', 'exomind-beta-host', '--test', 'native_export_manager'],
            ['-p', 'exomind-beta-host', '--test', 'agent_wait_http'],
            ['-p', 'exomind-beta-host', '--test', 'agent_export_http'],
            ['-p', 'exomind-beta-host', '--test', 'agent_access'],
            ['-p', 'exomind-beta-host', '--lib', 'management_roles_keep_their_existing_capabilities_and_never_issue_human'],
            ['-p', 'exomind-core', '--test', 'origin_provenance', 'conflicting_existing_body_cannot_advance_a_proof_prefix'],
            ['-p', 'exomind-beta-host', '--lib', 'a_position_signature_cannot_be_replayed_at_another_sequence'],
            ['-p', 'exomind-beta-host', '--lib', 'legacy_received_history_backfills_proofs_without_resetting_a_persisted_data_ack'],
            ['-p', 'exomind-beta-host', '--lib', 'relayed_source_requires_current_carrier_endorsement_fixed_key_and_no_revoked_source'],
          ];
          for (const [index, args] of cases.entries()) {
            const output = execFileSync('cargo', ['test', '--locked', ...args, '--', '--test-threads=1'], {
              encoding: 'utf8', maxBuffer: 32 * 1024 * 1024, timeout: index === 0 ? 600000 : 120000,
            });
            process.stdout.write(output);
            const results = [...output.matchAll(/test result: ok\. (\d+) passed; (\d+) failed;/g)];
            assert.ok(results.some(match => Number(match[1]) > 0 && Number(match[2]) === 0), `No passing tests ran for ${args.at(-1)}`);
          }
          NODE
      - name: Generate fixture from pinned Core8 history
        shell: bash
        run: |
          if git cat-file -e 85f7df92d0eccf1de624ab9220d4d8944797f28b^{commit} > "$CORE10_EVIDENCE/source-commit-check.stdout" 2> "$CORE10_EVIDENCE/source-commit-check.stderr"; then
            echo '{"sourceSha":"85f7df92d0eccf1de624ab9220d4d8944797f28b","status":"source-available"}' > "$CORE10_EVIDENCE/fixture-generation.json"
          else
            echo '{"sourceSha":"85f7df92d0eccf1de624ab9220d4d8944797f28b","status":"failed"}' > "$CORE10_EVIDENCE/fixture-generation.json"
            echo "Checkout is missing pinned Core8 source commit 85f7df92d0eccf1de624ab9220d4d8944797f28b" >&2
            exit 1
          fi
          if bun scripts/dev/beta-core8-fixture.ts --out "$CORE10_EVIDENCE/fixture" > "$CORE10_EVIDENCE/generate.stdout" 2> "$CORE10_EVIDENCE/generate.stderr"; then
            cat "$CORE10_EVIDENCE/generate.stdout"
            echo '{"sourceSha":"85f7df92d0eccf1de624ab9220d4d8944797f28b","status":"passed"}' > "$CORE10_EVIDENCE/fixture-generation.json"
          else
            cat "$CORE10_EVIDENCE/generate.stdout"
            cat "$CORE10_EVIDENCE/generate.stderr" >&2
            echo '{"sourceSha":"85f7df92d0eccf1de624ab9220d4d8944797f28b","status":"failed"}' > "$CORE10_EVIDENCE/fixture-generation.json"
            exit 1
          fi
      - name: Generate fixture from pinned Core10 history
        shell: bash
        run: |
          if git cat-file -e 5708e0baf5cdc896559fab5172dc13805531ba33^{commit} > "$CORE10_EVIDENCE/core10-source-commit-check.stdout" 2> "$CORE10_EVIDENCE/core10-source-commit-check.stderr"; then
            echo '{"recipeSha":"5708e0baf5cdc896559fab5172dc13805531ba33","payloadSha":"cc3bc937c4196d1a6a838b10a82018dc37d66480","status":"source-available"}' > "$CORE10_EVIDENCE/core10-fixture-generation.json"
          else
            echo '{"recipeSha":"5708e0baf5cdc896559fab5172dc13805531ba33","payloadSha":"cc3bc937c4196d1a6a838b10a82018dc37d66480","status":"failed"}' > "$CORE10_EVIDENCE/core10-fixture-generation.json"
            echo "Checkout is missing pinned Core10 recipe 5708e0baf5cdc896559fab5172dc13805531ba33" >&2
            exit 1
          fi
          if bun scripts/dev/beta-core10-fixture.ts --out "$CORE10_EVIDENCE/core10-source" > "$CORE10_EVIDENCE/core10-generate.stdout" 2> "$CORE10_EVIDENCE/core10-generate.stderr"; then
            cat "$CORE10_EVIDENCE/core10-generate.stdout"
            CORE10_GENERATION_OUTPUT="$CORE10_EVIDENCE/core10-generate.stdout"
            export CORE10_GENERATION_OUTPUT
            CORE10_FIXTURE_PATH=$(node -e 'const assert=require("node:assert/strict");const result=JSON.parse(require("node:fs").readFileSync(process.env.CORE10_GENERATION_OUTPUT,"utf8"));assert.equal(result.recipeSha,"5708e0baf5cdc896559fab5172dc13805531ba33");assert.equal(result.payloadSha,"cc3bc937c4196d1a6a838b10a82018dc37d66480");assert.ok(typeof result.fixture==="string"&&result.fixture.length>0);process.stdout.write(result.fixture);')
            echo "EXOMIND_CORE_SCHEMA10_FIXTURE=$CORE10_FIXTURE_PATH" >> "$GITHUB_ENV"
            echo '{"recipeSha":"5708e0baf5cdc896559fab5172dc13805531ba33","payloadSha":"cc3bc937c4196d1a6a838b10a82018dc37d66480","status":"passed"}' > "$CORE10_EVIDENCE/core10-fixture-generation.json"
          else
            cat "$CORE10_EVIDENCE/core10-generate.stdout"
            cat "$CORE10_EVIDENCE/core10-generate.stderr" >&2
            echo '{"recipeSha":"5708e0baf5cdc896559fab5172dc13805531ba33","payloadSha":"cc3bc937c4196d1a6a838b10a82018dc37d66480","status":"failed"}' > "$CORE10_EVIDENCE/core10-fixture-generation.json"
            exit 1
          fi
      - name: Select current sources after archived fixture compilation
        shell: bash
        run: |
          # Archived and current local packages can share Cargo artifact paths.
          # Refresh the current entrypoints before validating this checkout.
          touch crates/exomind-core/src/lib.rs crates/exomind-beta-host/src/lib.rs
      - name: Run Core11 lifecycle, period and pinned Core8/Core10 migration regressions
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { spawnSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          import { join } from 'node:path';

          const evidence = process.env.CORE10_EVIDENCE;
          const core8Fixture = join(evidence, 'fixture/synthetic/archive');
          const core10Fixture = process.env.EXOMIND_CORE_SCHEMA10_FIXTURE;
          assert.ok(core10Fixture, 'The pinned Core10 fixture path must come from the generator CLI result');
          const cases = [
            {
              name: 'core-lifecycle-lib',
              args: ['test', '--locked', '-p', 'exomind-core', '--lib', 'original_lifecycle', '--', '--test-threads=1'],
              expected: [
                'release_local_replay_after_chunk_deletion_preserves_capture_and_action_receipts',
                'purge_reclaimed_replay_after_chunk_deletion_preserves_capture_and_action_receipts',
                'purge_reclaimed_waits_for_deadline_and_confirmation',
              ],
            },
            {
              name: 'core-public-lifecycle',
              args: ['test', '--locked', '-p', 'exomind-core', '--test', 'original_lifecycle', '--', '--test-threads=1'],
              expected: ['local_release_is_idempotent_and_leaves_another_profile_copy_and_fact_history_intact'],
            },
            {
              name: 'host-lifecycle-lib',
              args: ['test', '--locked', '-p', 'exomind-beta-host', '--lib', 'original_lifecycle', '--', '--test-threads=1'],
              expected: [
                'stale_automatic_queue_pages_cannot_reanimate_released_or_retained_bytes',
                'reclaim_deadline_uses_host_clock_and_expiry_never_deletes_automatically',
                'replication_negotiates_the_current_core11_schema',
              ],
            },
            {
              name: 'host-original-read-permit',
              args: ['test', '--locked', '-p', 'exomind-beta-host', '--lib', 'original_read_permit_tests', '--', '--test-threads=1'],
              expected: [
                'observer_permit_reads_multiple_ranges_and_finishes',
                'release_rejects_old_permit_reads_and_finish',
                'revoked_observer_grant_is_rechecked_for_read_and_finish',
                'permit_cannot_cross_a_reopened_host_core_generation',
              ],
            },
            {
              name: 'host-original-transfer-lib',
              args: ['test', '--locked', '-p', 'exomind-beta-host', '--lib', 'original_transfer', '--', '--test-threads=1'],
              expected: [
                'local_intent_is_rechecked_at_prepare_write_freeze_and_seal_without_erasing_suppression',
                'source_revocation_between_chunks_prevents_any_verified_receipt',
                'restore_pending_resumes_after_host_restart_without_a_view_when_auto_policy_is_off',
                'restore_pending_bypasses_auto_size_limit_after_host_restart_without_a_view',
                'restore_hash_mismatch_waits_for_host_retry_and_keeps_core_request_ids',
                'restore_retry_rotates_per_original_and_does_not_globally_defer_other_restores',
              ],
            },
            {
              name: 'host-peer-network-module',
              args: ['test', '--locked', '-p', 'exomind-beta-host', '--lib', 'peers::network::tests', '--', '--test-threads=1'],
              expected: [
                'peer_network_stop_cancels_probe_after_remote_receives_probe_frame',
                'stop_and_restart_retain_incoming_scope_until_its_blocking_work_drains',
              ],
            },
            {
              name: 'host-core8-core9-core10-hello-rejection',
              args: ['test', '--locked', '-p', 'exomind-beta-host', '--lib', 'sync_hello_is_rejected_before_core11_fact_exchange', '--', '--test-threads=1'],
              expected: [
                'core8_sync_hello_is_rejected_before_core11_fact_exchange',
                'core9_sync_hello_is_rejected_before_core11_fact_exchange',
                'core10_sync_hello_is_rejected_before_core11_fact_exchange',
              ],
            },
            {
              name: 'core-summary-currentness',
              args: ['test', '--locked', '-p', 'exomind-core', '--test', 'summaries', '--', '--test-threads=1'],
              expected: [
                'post_snapshot_correction_marks_review_changed_without_rewriting_saved_artifact',
                'pre_snapshot_and_unmatched_corrections_do_not_change_review_coverage',
                'replicated_post_snapshot_correction_is_detected_with_lower_receiver_local_seq',
                'replicated_prefreeze_correction_is_not_stale_with_higher_receiver_local_seq',
                'prefreeze_matching_corrections_keep_original_and_each_concurrent_fact',
                'prefreeze_unresolved_conflicting_out_of_range_and_other_profile_corrections_are_excluded',
                'prefreeze_budget_exclusion_lists_correction_without_sending_its_text',
                'bounded_correction_scan_does_not_let_digest_conflicts_exhaust_the_matching_target_budget',
                'bounded_correction_scan_does_not_read_conflicting_bodies_into_its_input_byte_budget',
                'bounded_correction_scan_has_a_total_candidate_limit_across_selected_captures',
                'bounded_correction_scan_keeps_other_targets_after_one_target_reaches_its_limit',
              ],
            },
            {
              name: 'core-correction-matching-index-plan',
              args: ['test', '--locked', '-p', 'exomind-core', '--lib', 'correction_candidates_seek_profile_target_digest_and_snapshot_without_sorting', '--', '--test-threads=1'],
              expected: ['correction_candidates_seek_profile_target_digest_and_snapshot_without_sorting'],
            },
            {
              name: 'core-old-raw-summary-preservation',
              args: ['test', '--locked', '-p', 'exomind-core', '--lib', 'genuine_legacy_summary_snapshot_fixture_stays_valid_without_rewriting_raw_body', '--', '--test-threads=1'],
              expected: ['genuine_legacy_summary_snapshot_fixture_stays_valid_without_rewriting_raw_body'],
              fixture: 'core10',
            },
            {
              name: 'host-original-and-corrections-model-material',
