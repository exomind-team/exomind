name: Beta Build Validation

# Internal build artifacts only. This name is intentionally NOT the
# "Build & Release" name watched by release-pages.yml. No push/tag trigger.
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Existing branch/tag/commit to resolve (read only)
        required: true
        type: string
        default: dev-0.6
      expected_sha:
        description: Exact existing 40-hex source commit; fail if ref moved
        required: true
        type: string
      expected_version:
        description: Beta config version to build; never inferred from Alpha package.json
        required: true
        type: string
        default: 0.6.0-beta11

permissions:
  contents: read

concurrency:
  group: beta-build-validation-${{ github.ref }}-${{ inputs.expected_sha }}
  cancel-in-progress: false

env:
  BUN_VERSION: '1.3.8'
  RUST_TOOLCHAIN: stable
  CARGO_BUILD_JOBS: '1'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_DEV_INCREMENTAL: 'false'
  CARGO_PROFILE_DEV_CODEGEN_UNITS: '16'
  CARGO_TARGET_DIR: ${{ github.workspace }}/target/beta-validation
  EXOMIND_SKIP_BUN_INSTALL: '1'

jobs:
  resolve-source:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
      version: ${{ steps.identity.outputs.version }}
      identifier: ${{ steps.identity.outputs.identifier }}
      version_code: ${{ steps.identity.outputs.version_code }}
      config_hash: ${{ steps.identity.outputs.config_hash }}
      cargo_lock_hash: ${{ steps.identity.outputs.cargo_lock_hash }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Resolve exact candidate and Beta identity
        id: identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          import assert from 'node:assert/strict';
          assert.match(process.env.EXPECTED_SHA ?? '', /^[0-9a-fA-F]{40}$/);
          assert.match(process.env.EXPECTED_VERSION ?? '', /^0\.6\.0-beta[0-9]+$/);
          const sha = execFileSync('git', ['rev-parse', 'HEAD'], {encoding:'utf8'}).trim();
          assert.equal(sha, process.env.EXPECTED_SHA.toLowerCase(), 'Source ref moved; no build started');
          const file = 'src-tauri/tauri.beta.conf.json', config = JSON.parse(fs.readFileSync(file,'utf8'));
          assert.equal(config.identifier, 'com.exomind.app.v06.beta');
          assert.equal(config.productName, 'ExoMind Beta');
          assert.equal(config.version, process.env.EXPECTED_VERSION);
          assert.equal(config.build.beforeBuildCommand, 'bun run build:web');
          assert.ok(config.app.windows.some(window => window.label === 'main' && window.url === 'beta.html'));
          assert.deepEqual(config.app.security.capabilities, ['beta','beta-overlay']);
          assert.ok(Number.isSafeInteger(config.bundle.android.versionCode) && config.bundle.android.versionCode > 0);
          const hash = file => createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          const outputs = {sha, version:config.version, identifier:config.identifier, version_code:config.bundle.android.versionCode, config_hash:hash(file), cargo_lock_hash:hash('Cargo.lock')};
          for (const [key,value] of Object.entries(outputs)) fs.appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${value}\n`);
          console.log(JSON.stringify({validation_only:true, ...outputs, release:false, pages:false}));
          NODE

  desktop:
    needs: resolve-source
    name: Beta ${{ matrix.label }} build
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            executable: exomind.exe
          - label: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            executable: exomind
          - label: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            executable: exomind
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      SOURCE_SHA: ${{ needs.resolve-source.outputs.sha }}
      BETA_VERSION: ${{ needs.resolve-source.outputs.version }}
      BETA_CONFIG_HASH: ${{ needs.resolve-source.outputs.config_hash }}
      CARGO_LOCK_HASH: ${{ needs.resolve-source.outputs.cargo_lock_hash }}
      VITE_APP_VERSION: ${{ needs.resolve-source.outputs.version }}
      VITE_BUILD_HASH: ${{ needs.resolve-source.outputs.sha }}
      BUILD_LABEL: ${{ matrix.label }}
      BUILD_TARGET: ${{ matrix.target }}
      BUILD_EXECUTABLE: ${{ matrix.executable }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - name: Linux desktop prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev librsvg2-dev patchelf libssl-dev libsoup-3.0-dev
      - name: Bound Windows linker parallelism
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sysroot = (rustc --print sysroot).Trim()
          $linker = Join-Path $sysroot 'lib/rustlib/x86_64-pc-windows-msvc/bin/rust-lld.exe'
          if (-not (Test-Path -LiteralPath $linker -PathType Leaf)) { throw 'Owned Rust toolchain lld-link is missing' }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" >> $env:GITHUB_ENV
          'RUSTFLAGS=-C linker-flavor=lld-link -C link-arg=/threads:1 -C link-arg=/DEBUG:NONE' >> $env:GITHUB_ENV
      - name: Install frozen frontend dependencies (no lifecycle scripts)
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify checkout and Beta configuration before building
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process'; import {createHash} from 'node:crypto';
          const hash = file => createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          assert.equal(execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(), process.env.SOURCE_SHA);
          assert.equal(hash('src-tauri/tauri.beta.conf.json'), process.env.BETA_CONFIG_HASH);
          assert.equal(hash('Cargo.lock'), process.env.CARGO_LOCK_HASH);
          const config=JSON.parse(fs.readFileSync('src-tauri/tauri.beta.conf.json','utf8'));
          assert.equal(config.identifier,'com.exomind.app.v06.beta'); assert.equal(config.version,process.env.BETA_VERSION);
          NODE
      - name: Build embedded Beta debug executable (no installer/signing/publishing)
        shell: bash
        run: node node_modules/@tauri-apps/cli/tauri.js build --ci --debug --no-bundle --target "${{ matrix.target }}" --config src-tauri/tauri.beta.conf.json -- --locked
      - name: Check actual Windows PE product identity
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = Join-Path $env:CARGO_TARGET_DIR "$env:BUILD_TARGET/debug/exomind.exe"
          $identity = (Get-Item -LiteralPath $binary).VersionInfo
          if ($identity.ProductName -ne 'ExoMind Beta') { throw 'Built PE is not Beta' }
          if ($identity.ProductVersion -ne $env:BETA_VERSION -or $identity.FileVersion -ne $env:BETA_VERSION) { throw 'Built PE version does not match the exact Beta candidate' }
          # The Beta-only resource seam must override shared Alpha Cargo
          # metadata. Record and verify the actual PE, not only the config.
          $metadata = [ordered]@{product_name=$identity.ProductName;product_version=$identity.ProductVersion;file_version=$identity.FileVersion}
          $metadata | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'beta-pe-identity.json') -Encoding utf8NoBOM
      - name: Package validation executable and provenance
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import path from 'node:path'; import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process'; import {createHash} from 'node:crypto';
          const hash = file => createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          assert.equal(execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),process.env.SOURCE_SHA);
          assert.equal(hash('Cargo.lock'),process.env.CARGO_LOCK_HASH,'Build must not resolve a different dependency lock');
          assert.equal(hash('src-tauri/tauri.beta.conf.json'),process.env.BETA_CONFIG_HASH);
          assert.ok(fs.existsSync('dist/beta.html'),'Beta frontend entry was not embedded');
          const label=process.env.BUILD_LABEL, output=path.join('validation-artifacts',label);fs.mkdirSync(output,{recursive:true});
          const source=path.join(process.env.CARGO_TARGET_DIR,process.env.BUILD_TARGET,'debug',process.env.BUILD_EXECUTABLE);
          assert.ok(fs.statSync(source).isFile(),'Expected exact target executable missing');
          const binary=path.join(output,`ExoMind-${process.env.BETA_VERSION}-${label}${process.platform==='win32'?'.exe':''}`);
          fs.copyFileSync(source,binary,fs.constants.COPYFILE_EXCL);
          if(process.platform!=='win32') fs.chmodSync(binary,0o755);
          let artifact=binary;
          if(process.platform!=='win32') {artifact=binary+'.tar.gz';execFileSync('tar',['-czf',artifact,'-C',output,path.basename(binary)],{stdio:'inherit'});fs.unlinkSync(binary);}
          const config=JSON.parse(fs.readFileSync('src-tauri/tauri.beta.conf.json','utf8'));
          const native=process.platform==='win32'?JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP,'beta-pe-identity.json'),'utf8')):null;
          const info={validation_only:true,source_sha:process.env.SOURCE_SHA,version:config.version,version_source:'tauri.beta.conf.json; VITE_APP_VERSION uses the same value',identifier:config.identifier,product_name:config.productName,entry:'beta.html',platform:label,target:process.env.BUILD_TARGET,profile:'debug embedded assets; no dev server',core_schema:Number(fs.readFileSync('crates/exomind-core/src/lib.rs','utf8').match(/CORE_SCHEMA_VERSION:\s*i64\s*=\s*(\d+)/)?.[1]),source_cargo_package_version:fs.readFileSync('src-tauri/Cargo.toml','utf8').match(/^version\s*=\s*"([^"]+)"/m)?.[1],native_resource_metadata:native,native_resource_version_matches_app:native?native.product_version===config.version&&native.file_version===config.version:null,config_sha256:process.env.BETA_CONFIG_HASH,cargo_lock_sha256:process.env.CARGO_LOCK_HASH,rustc:execFileSync('rustc',['-Vv'],{encoding:'utf8'}).trim(),cargo:execFileSync('cargo',['-V'],{encoding:'utf8'}).trim(),file:path.basename(artifact),bytes:fs.statSync(artifact).size,sha256:hash(artifact),runtime_tested:false,installer_tested:false,published:false,limitations:'Raw macOS/Linux binaries are build validation artifacts, not tested app/install packages. Device behavior and upgrade compatibility require separate same-candidate validation.'};
          fs.writeFileSync(path.join(output,'build-info.json'),JSON.stringify(info,null,2));
          NODE
      - uses: actions/upload-artifact@v7
        with:
          name: beta-${{ matrix.label }}-${{ needs.resolve-source.outputs.version }}-${{ needs.resolve-source.outputs.sha }}-attempt${{ github.run_attempt }}
          path: validation-artifacts/${{ matrix.label }}/
          if-no-files-found: error
          retention-days: 7

  android:
    needs: resolve-source
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      SOURCE_SHA: ${{ needs.resolve-source.outputs.sha }}
      BETA_VERSION: ${{ needs.resolve-source.outputs.version }}
      BETA_VERSION_CODE: ${{ needs.resolve-source.outputs.version_code }}
      BETA_CONFIG_HASH: ${{ needs.resolve-source.outputs.config_hash }}
      CARGO_LOCK_HASH: ${{ needs.resolve-source.outputs.cargo_lock_hash }}
      VITE_APP_VERSION: ${{ needs.resolve-source.outputs.version }}
      VITE_BUILD_HASH: ${{ needs.resolve-source.outputs.sha }}
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=1 -Dkotlin.compiler.execution.strategy=in-process -Dkotlin.incremental=false -Xmx2048m
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Install explicit Android SDK/NDK build inputs
        shell: bash
        run: |
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.0.13004108'
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> "$GITHUB_ENV"
      - name: Install frozen frontend dependencies (no lifecycle scripts)
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify exact candidate before Android generation
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';import {execFileSync} from 'node:child_process';import {createHash} from 'node:crypto';
          const hash=file=>createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          assert.equal(execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),process.env.SOURCE_SHA);assert.equal(hash('Cargo.lock'),process.env.CARGO_LOCK_HASH);assert.equal(hash('src-tauri/tauri.beta.conf.json'),process.env.BETA_CONFIG_HASH);
          const config=JSON.parse(fs.readFileSync('src-tauri/tauri.beta.conf.json','utf8'));assert.equal(config.identifier,'com.exomind.app.v06.beta');assert.equal(config.version,process.env.BETA_VERSION);
          assert.ok(!fs.existsSync('src-tauri/gen/android'),'Require a fresh generated Android project, not stale Alpha/Beta output');
          NODE
      - name: Generate Beta Android project explicitly
        run: node node_modules/@tauri-apps/cli/tauri.js android init --ci --skip-targets-install --config src-tauri/tauri.beta.conf.json
      - name: Prepare Android network/system-bars/IME integration
        shell: bash
        run: |
          bun scripts/dev/android-manifest-permission.ts
          bun scripts/dev/beta-android-prepare.ts --project-root "$GITHUB_WORKSPACE"
      - name: Build Beta debug APKs (arm64 and x86_64; no device/install/release key)
        run: node node_modules/@tauri-apps/cli/tauri.js android build --ci --debug --apk --split-per-abi -t aarch64 x86_64 --config src-tauri/tauri.beta.conf.json -- --locked
      - name: Verify actual APK identities and write provenance
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';import assert from 'node:assert/strict';import {execFileSync} from 'node:child_process';import {createHash} from 'node:crypto';
          const hash=file=>createHash('sha256').update(fs.readFileSync(file)).digest('hex');assert.equal(execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),process.env.SOURCE_SHA);assert.equal(hash('Cargo.lock'),process.env.CARGO_LOCK_HASH);assert.equal(hash('src-tauri/tauri.beta.conf.json'),process.env.BETA_CONFIG_HASH);assert.ok(fs.existsSync('dist/beta.html'));
          const root='src-tauri/gen/android/app/build/outputs/apk',output='validation-artifacts/android';fs.mkdirSync(output,{recursive:true});
          const walk=directory=>fs.readdirSync(directory,{withFileTypes:true}).flatMap(entry=>entry.isDirectory()?walk(path.join(directory,entry.name)):[path.join(directory,entry.name)]);
          const apks=walk(root).filter(file=>file.endsWith('.apk')&&file.includes('debug')&&!/androidTest/i.test(file));assert.equal(apks.length,2,'Exactly two ABI-specific debug APKs required');
          const tools=path.join(process.env.ANDROID_HOME,'build-tools','36.0.0'),seen=new Set(),files=[];
          for(const source of apks){const badging=execFileSync(path.join(tools,'aapt'),['dump','badging',source],{encoding:'utf8',timeout:10000});assert.equal(/^package: name='([^']+)'/m.exec(badging)?.[1],'com.exomind.app.v06.beta');assert.equal(/versionName='([^']+)'/.exec(badging)?.[1],process.env.BETA_VERSION);assert.equal(/versionCode='([^']+)'/.exec(badging)?.[1],process.env.BETA_VERSION_CODE);assert.ok(/^application-debuggable\b/m.test(badging));const abi=/^native-code: '([^']+)'\s*$/m.exec(badging)?.[1];assert.ok(['arm64-v8a','x86_64'].includes(abi)&&!seen.has(abi));seen.add(abi);execFileSync(path.join(tools,'apksigner'),['verify',source],{stdio:'inherit',timeout:10000});const target=path.join(output,`ExoMind-${process.env.BETA_VERSION}-${abi}-${process.env.SOURCE_SHA.slice(0,12)}.apk`);fs.copyFileSync(source,target,fs.constants.COPYFILE_EXCL);files.push({file:path.basename(target),abi,bytes:fs.statSync(target).size,sha256:hash(target),package:'com.exomind.app.v06.beta',version:process.env.BETA_VERSION,version_code:Number(process.env.BETA_VERSION_CODE)});}
          const info={validation_only:true,source_sha:process.env.SOURCE_SHA,version:process.env.BETA_VERSION,identifier:'com.exomind.app.v06.beta',entry:'beta.html',profile:'debug APK',core_schema:Number(fs.readFileSync('crates/exomind-core/src/lib.rs','utf8').match(/CORE_SCHEMA_VERSION:\s*i64\s*=\s*(\d+)/)?.[1]),config_sha256:process.env.BETA_CONFIG_HASH,cargo_lock_sha256:process.env.CARGO_LOCK_HASH,rustc:execFileSync('rustc',['-Vv'],{encoding:'utf8'}).trim(),ndk:'28.0.13004108',sdk:36,build_tools:'36.0.0',files,runtime_tested:false,upgrade_tested:false,published:false,signing:'Runner-local debug key only; not release-signed or guaranteed upgrade-compatible with local/previous candidates.'};fs.writeFileSync(path.join(output,'build-info.json'),JSON.stringify(info,null,2));
          NODE
      - uses: actions/upload-artifact@v7
        with:
          name: beta-android-${{ needs.resolve-source.outputs.version }}-${{ needs.resolve-source.outputs.sha }}-attempt${{ github.run_attempt }}
          path: validation-artifacts/android/
          if-no-files-found: error
          retention-days: 7
