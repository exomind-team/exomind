name: Build & Release

on:
  push:
    tags:
      - "v*" # 单一发布 tag：v0.x.y
  workflow_dispatch:
    inputs:
      promote_tag:
        description: Existing tag to promote（要晋升的既有 tag）
        required: true
        type: string

permissions:
  contents: write

env:
  RUST_TOOLCHAIN: stable
  BUN_VERSION: "1.3.8" # 固定版本，v1.3.10 在 Windows 上有 resolving hang bug

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: Android APK on Windows runner
  # Split from the old combined Windows job so Android/Windows can run in parallel.
  # ─────────────────────────────────────────────────────────────
  build-android-selfhosted:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine build targets (确定构建目标)
        id: targets
        shell: pwsh
        run: |
          $android = "true"
          $windows = "false"
          "BUILD_ANDROID=$android" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "BUILD_WINDOWS=$windows" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Build Android=$android Windows=$windows (parallel Android job / 并行 Android job)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 17
        if: steps.targets.outputs.BUILD_ANDROID == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Ensure local Bun is available (确保本机 Bun 可用，版本锁定)
        shell: pwsh
        run: |
          $requiredVersion = "${{ env.BUN_VERSION }}"
          $bunCmd = Get-Command bun -ErrorAction SilentlyContinue
          $needInstall = $false

          if (-not $bunCmd -or ($bunCmd.Source -match '(?i)wsl|\\ubuntu\\')) {
            Write-Host "Bun not found or is WSL version."
            $needInstall = $true
          } else {
            $currentVersion = (bun --version 2>$null)
            if ($currentVersion -ne $requiredVersion) {
              Write-Host "Bun version mismatch: found $currentVersion, need $requiredVersion"
              $needInstall = $true
            } else {
              Write-Host "Found matching Bun $currentVersion at $($bunCmd.Source)"
            }
          }

          if ($needInstall) {
            Write-Host "Installing bun@$requiredVersion via npm..."
            npm install -g "bun@$requiredVersion"
            $npmPrefix = (npm config get prefix).Trim()
            if ($npmPrefix) {
              $env:Path = "$npmPrefix;$env:Path"
              "$npmPrefix" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            }
            $bunCmd = Get-Command bun -ErrorAction SilentlyContinue
            if (-not $bunCmd) { throw "Bun is unavailable after installation." }
            if ($bunCmd.Source -match '(?i)wsl|\\ubuntu\\') {
              throw "Detected WSL bun path: $($bunCmd.Source). Please use native Windows Bun."
            }
          }
          Write-Host "Using Bun from: $($bunCmd.Source)"
          bun --version

      - name: Rust diagnostics (Rust 诊断输出)
        shell: pwsh
        run: |
          Write-Host '=== Rust diagnostics / Rust 诊断输出 ==='
          Write-Host ('event_name={0}' -f '${{ github.event_name }}')
          Write-Host ('ref={0}' -f '${{ github.ref }}')
          Write-Host ('runner={0} os={1} arch={2}' -f $env:RUNNER_NAME, $env:RUNNER_OS, $env:RUNNER_ARCH)
          $currentUser = whoami
          Write-Host ('whoami={0}' -f $currentUser)
          Write-Host ('USERPROFILE={0}' -f $env:USERPROFILE)
          Write-Host ('HOME={0}' -f $env:HOME)
          Write-Host ('CARGO_HOME={0}' -f $env:CARGO_HOME)
          Write-Host ('RUSTUP_HOME={0}' -f $env:RUSTUP_HOME)

          $cargoBin = Join-Path $env:USERPROFILE '.cargo\bin'
          $cargoBinExists = Test-Path $cargoBin
          Write-Host ('cargoBin={0} exists={1}' -f $cargoBin, $cargoBinExists)

          foreach ($name in @('rustup.exe', 'rustc.exe', 'cargo.exe', 'rustup', 'rustc', 'cargo')) {
            $candidate = Join-Path $cargoBin $name
            $candidateExists = Test-Path $candidate
            Write-Host ('candidate={0} exists={1}' -f $candidate, $candidateExists)
          }

          Write-Host 'Get-Command (before prepend PATH)'
          foreach ($cmd in @('rustup', 'rustc', 'cargo')) {
            $resolved = Get-Command $cmd -ErrorAction SilentlyContinue
            if ($resolved) {
              Write-Host (' - {0} [{1}]' -f $cmd, $resolved.Source)
            } else {
              Write-Host (' - {0} [NOT_FOUND]' -f $cmd)
            }
          }

      - name: Use local Rust toolchain (使用本机 Rust 工具链，禁止 WSL)
        shell: pwsh
        run: |
          $preferredCargoHome = "D:\actions-runner\rust\cargo"
          $preferredRustupHome = "D:\actions-runner\rust\rustup"
          $preferredCargoBin = Join-Path $preferredCargoHome "bin"
          if (Test-Path $preferredCargoBin) {
            $env:CARGO_HOME = $preferredCargoHome
            $env:RUSTUP_HOME = $preferredRustupHome
            "CARGO_HOME=$preferredCargoHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "RUSTUP_HOME=$preferredRustupHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            $env:Path = "$preferredCargoBin;$env:Path"
            "$preferredCargoBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

          $cargoBin = Join-Path $env:USERPROFILE ".cargo\bin"
          if (Test-Path $cargoBin) {
            $env:Path = "$cargoBin;$env:Path"
            "$cargoBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

          $rustupCmd = Get-Command rustup -ErrorAction SilentlyContinue
          $rustcCmd = Get-Command rustc -ErrorAction SilentlyContinue
          $cargoCmd = Get-Command cargo -ErrorAction SilentlyContinue
          if ((-not $rustupCmd) -or (-not $rustcCmd) -or (-not $cargoCmd)) {
            throw "Rust toolchain not found on Windows runner."
          }

          if (($rustupCmd.Source -match '(?i)wsl|\\ubuntu\\') -or ($rustcCmd.Source -match '(?i)wsl|\\ubuntu\\') -or ($cargoCmd.Source -match '(?i)wsl|\\ubuntu\\')) {
            throw "Detected Rust command from WSL path. Please use native Windows Rust toolchain."
          }

          rustup default stable
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to select stable Rust toolchain. Please install stable locally first (例如: rustup toolchain install stable)."
          }

          rustup show active-toolchain
          rustc -vV
          cargo -V

      - name: Get short commit hash
        id: hash
        shell: pwsh
        run: |
          $short = $env:GITHUB_SHA.Substring(0, 7)
          "HASH=$short" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Resolve app version (解析应用版本)
        id: app_version
        shell: pwsh
        run: |
          $refName = "${{ github.ref_name }}"
          $appVersion = ""

          if ($refName.StartsWith("v")) {
            $appVersion = $refName.Substring(1)
          }

          if (-not $appVersion) {
            $packageVersion = (Get-Content -Path "package.json" -Raw | ConvertFrom-Json).version
            $appVersion = [string]$packageVersion
          }

          if ($appVersion.StartsWith("v")) {
            $appVersion = $appVersion.Substring(1)
          }

          if (-not $appVersion) {
            throw "Cannot resolve app version from tag or package.json."
          }

          "APP_VERSION=$appVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Resolved app version: $appVersion"

      - name: Clean stale node_modules (清理残留依赖，避免 bun 校验卡死)
        shell: pwsh
        run: |
          if (Test-Path node_modules) {
            Write-Host "Removing stale node_modules from previous run..."
            Remove-Item -Recurse -Force node_modules
          }

      - name: Clear bun global cache (清理 bun 全局缓存)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          try {
            Write-Host "Running bun pm cache rm (best effort)..."
            bun pm cache rm
          } catch {
            Write-Warning "bun pm cache rm failed: $($_.Exception.Message)"
          }

          $bunCacheDir = Join-Path $env:USERPROFILE ".bun\install\cache"
          if (Test-Path $bunCacheDir) {
            try {
              Write-Host "Removing bun global cache directory: $bunCacheDir"
              Remove-Item -Recurse -Force $bunCacheDir -ErrorAction Stop
            } catch {
              Write-Warning "Failed to remove bun global cache directory: $($_.Exception.Message)"
            }
          } else {
            Write-Host "Bun global cache directory not found, skip cleanup."
          }

      - name: Install dependencies with isolated cache and retry (安装依赖：隔离缓存 + 重试)
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = "Stop"

          function Invoke-BunInstallWithCache {
            param(
              [Parameter(Mandatory = $true)][string]$CacheDir,
              [Parameter(Mandatory = $true)][string]$AttemptLabel,
              [int]$TimeoutSeconds = 180
            )

            if (Test-Path $CacheDir) {
              Remove-Item -Recurse -Force $CacheDir -ErrorAction SilentlyContinue
            }
            New-Item -ItemType Directory -Force -Path $CacheDir | Out-Null

            $env:BUN_INSTALL_CACHE_DIR = $CacheDir
            $arguments = @("install", "--cache-dir", $CacheDir)
            Write-Host "[$AttemptLabel] Running: bun $($arguments -join ' ')"

            $commandText = "bun $($arguments -join ' ')"
            $process = Start-Process -FilePath "cmd.exe" -ArgumentList "/c", $commandText -PassThru
            $finished = $process.WaitForExit($TimeoutSeconds * 1000)

            if (-not $finished) {
              Write-Warning "[$AttemptLabel] bun install timed out after $TimeoutSeconds seconds."
              try {
                & taskkill /PID $process.Id /T /F | Out-Null
              } catch {
                Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              }
              throw "bun install timeout in $AttemptLabel"
            }

            if ($process.ExitCode -ne 0) {
              throw "bun install failed in $AttemptLabel with exit code $($process.ExitCode)"
            }
          }

          $baseCacheDir = Join-Path $env:RUNNER_TEMP "bun-install-cache"
          $firstAttemptCacheDir = Join-Path $baseCacheDir "attempt-1"
          $secondAttemptCacheDir = Join-Path $baseCacheDir "attempt-2"

          try {
            Invoke-BunInstallWithCache -CacheDir $firstAttemptCacheDir -AttemptLabel "attempt 1 / 第一次"
          } catch {
            Write-Warning "First install attempt failed: $($_.Exception.Message)"
            Write-Host "Retry bun install / 重试 bun install with fresh isolated cache."
            Invoke-BunInstallWithCache -CacheDir $secondAttemptCacheDir -AttemptLabel "attempt 2 / 第二次"
          }

          "EXOMIND_SKIP_BUN_INSTALL=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "EXOMIND_SKIP_BUN_INSTALL=1 (reuse bootstrapped dependencies / 复用前置依赖安装)"

      # ─── Android build ──────────────────────────────────────

      - name: Configure local Android toolchain (配置本地 Android 工具链)
        if: steps.targets.outputs.BUILD_ANDROID == 'true'
        shell: pwsh
        run: |
          $defaultJavaHome = "C:\Program Files\Eclipse Adoptium\jdk-17.0.13.11-hotspot"
          $javaHome = $env:JAVA_HOME
          if (-not $javaHome -or -not (Test-Path $javaHome)) {
            if (-not (Test-Path $defaultJavaHome)) {
              throw "JAVA_HOME is invalid and default path not found: $defaultJavaHome"
            }
            $javaHome = $defaultJavaHome
          }
          "JAVA_HOME=$javaHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $javaBin = Join-Path $javaHome "bin"
          if (Test-Path $javaBin) {
            "$javaBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

          $defaultAndroidSdkRoot = "D:\data\AndroidSDK"
          $hostedAndroidSdkRoot = "C:\Android\android-sdk"
          $androidSdkRoot = $env:ANDROID_SDK_ROOT
          if (-not $androidSdkRoot -or -not (Test-Path $androidSdkRoot)) {
            if (Test-Path $hostedAndroidSdkRoot) {
              $androidSdkRoot = $hostedAndroidSdkRoot
            } elseif (Test-Path $defaultAndroidSdkRoot) {
              $androidSdkRoot = $defaultAndroidSdkRoot
            } else {
              throw "ANDROID_SDK_ROOT is invalid and no known SDK path exists."
            }
          }
          "ANDROID_SDK_ROOT=$androidSdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if (-not $env:ANDROID_HOME -or -not (Test-Path $env:ANDROID_HOME)) {
            "ANDROID_HOME=$androidSdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

          foreach ($candidate in @(
            (Join-Path $androidSdkRoot "platform-tools"),
            (Join-Path $androidSdkRoot "cmdline-tools\latest\bin"),
            (Join-Path $androidSdkRoot "cmdline-tools\bin"),
            (Join-Path $androidSdkRoot "emulator")
          )) {
            if (Test-Path $candidate) {
              "$candidate" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            }
          }

      - name: Validate Android signing secrets early (提前校验 Android 签名密钥)
        if: steps.targets.outputs.BUILD_ANDROID == 'true'
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          foreach ($required in @("ANDROID_KEYSTORE_BASE64", "ANDROID_KEYSTORE_PASSWORD", "ANDROID_KEY_ALIAS", "ANDROID_KEY_PASSWORD")) {
            if (-not (Get-Item -Path "Env:$required" -ErrorAction SilentlyContinue)) {
              throw "Missing secret: $required"
            }
          }

      - name: Ensure Rust Android targets (确保 Rust Android 目标)
        if: steps.targets.outputs.BUILD_ANDROID == 'true'
        shell: pwsh
        run: rustup target add aarch64-linux-android i686-linux-android

      - name: Init Android
        if: steps.targets.outputs.BUILD_ANDROID == 'true'
        run: bun tauri android init
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch Android network discovery prerequisites（注入 Android 发现权限 / 组播锁 / release cleartext）
        if: steps.targets.outputs.BUILD_ANDROID == 'true'
        shell: pwsh
        run: |
          bun scripts/dev/android-manifest-permission.ts

      - name: Verify Android discovery patch persisted（校验 Android 发现权限 / 组播锁 / cleartext 配置）
        if: steps.targets.outputs.BUILD_ANDROID == 'true'
        shell: pwsh
        run: |
          $manifestPath = "src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          if (-not (Test-Path $manifestPath)) {
            throw "Manifest not found: $manifestPath"
          }
          foreach ($permission in @(
            "android.permission.RECORD_AUDIO",
            "android.permission.MODIFY_AUDIO_SETTINGS",
            "android.permission.ACCESS_NETWORK_STATE",
            "android.permission.ACCESS_WIFI_STATE",
            "android.permission.CHANGE_WIFI_MULTICAST_STATE"
          )) {
            if (-not (Select-String -Path $manifestPath -Pattern $permission -SimpleMatch -Quiet)) {
              throw "Missing $permission in AndroidManifest.xml"
            }
          }
          if (-not (Select-String -Path $manifestPath -Pattern 'android:usesCleartextTraffic="true"' -SimpleMatch -Quiet)) {
            throw 'Missing android:usesCleartextTraffic="true" in AndroidManifest.xml'
          }

          $mainActivityPath = "src-tauri/gen/android/app/src/main/java/com/exomind/app/MainActivity.kt"
          if (-not (Test-Path $mainActivityPath)) {
            throw "MainActivity not found: $mainActivityPath"
          }
          $mainActivityContent = Get-Content -Path $mainActivityPath -Raw -Encoding UTF8
          foreach ($pattern in @(
            'WifiManager\.MulticastLock',
            'acquireMulticastLock\(\)',
            'releaseMulticastLock\(\)',
            'createMulticastLock\("exomind-mdns-lock"\)'
          )) {
            if (-not ($mainActivityContent -match $pattern)) {
              throw "Missing Android multicast patch pattern: $pattern"
            }
          }

          $buildGradlePath = "src-tauri/gen/android/app/build.gradle.kts"
          if (-not (Test-Path $buildGradlePath)) {
            throw "Build gradle not found: $buildGradlePath"
          }
          $buildGradleContent = Get-Content -Path $buildGradlePath -Raw -Encoding UTF8
          $releaseCleartextPattern = 'getByName\("release"\)\s*\{[\s\S]*manifestPlaceholders\["usesCleartextTraffic"\]\s*=\s*"true"'
          if (-not ($buildGradleContent -match $releaseCleartextPattern)) {
            throw "Missing usesCleartextTraffic=true in release block."
          }
          $debugCleartextPattern = 'getByName\("debug"\)\s*\{[\s\S]*manifestPlaceholders\["usesCleartextTraffic"\]\s*=\s*"true"'
          if (-not ($buildGradleContent -match $debugCleartextPattern)) {
            throw "Missing usesCleartextTraffic=true in debug block."
          }

          Write-Host "Android discovery permissions, multicast lock, and cleartext release placeholder verified."

      - name: Build Android APK only (仅构建 APK，aarch64 + i686)
        if: steps.targets.outputs.BUILD_ANDROID == 'true'
        run: bun tauri android build --ci --apk --split-per-abi -t aarch64 i686
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_APP_VERSION: ${{ steps.app_version.outputs.APP_VERSION }}
          VITE_BUILD_HASH: ${{ steps.hash.outputs.HASH }}
          # Stabilize Kotlin/Gradle on Windows runners (稳定 Windows 上 Kotlin/Gradle 构建)
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dkotlin.compiler.execution.strategy=in-process -Dkotlin.incremental=false

      - name: Validate Android app name/icon/artifact size (门禁校验)
        if: steps.targets.outputs.BUILD_ANDROID == 'true'
        run: bun run check:android:meta
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Android signing keystore (准备签名密钥库)
        if: steps.targets.outputs.BUILD_ANDROID == 'true'
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if (-not $env:ANDROID_KEYSTORE_BASE64) {
            throw "Missing secret: ANDROID_KEYSTORE_BASE64"
          }
          $keystorePath = Join-Path $env:RUNNER_TEMP "android-release.jks"
          try {
            $bytes = [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64)
          } catch {
            throw "ANDROID_KEYSTORE_BASE64 is not valid Base64."
          }
          [IO.File]::WriteAllBytes($keystorePath, $bytes)
          "ANDROID_KEYSTORE_PATH=$keystorePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Sign Android APK artifacts (签名 APK 产物)
        if: steps.targets.outputs.BUILD_ANDROID == 'true'
        shell: pwsh
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          foreach ($required in @("ANDROID_KEYSTORE_PATH", "ANDROID_KEYSTORE_PASSWORD", "ANDROID_KEY_ALIAS", "ANDROID_KEY_PASSWORD")) {
            if (-not (Get-Item -Path "Env:$required" -ErrorAction SilentlyContinue)) {
              throw "Missing secret: $required"
            }
          }

          $sdkRoot = if ($env:ANDROID_SDK_ROOT) { $env:ANDROID_SDK_ROOT } elseif ($env:ANDROID_HOME) { $env:ANDROID_HOME } else { $null }
          if (-not $sdkRoot) {
            throw "ANDROID_SDK_ROOT or ANDROID_HOME must be set."
          }

          $buildToolsRoot = Join-Path $sdkRoot "build-tools"
          $buildToolsDir = Get-ChildItem -Path $buildToolsRoot -Directory | Sort-Object { [Version]$_.Name } | Select-Object -Last 1
          if (-not $buildToolsDir) {
            throw "No Android build-tools directory found under $buildToolsRoot"
          }

          $zipalign = Join-Path $buildToolsDir.FullName "zipalign.exe"
          $apksigner = Join-Path $buildToolsDir.FullName "apksigner.bat"
          if ((-not (Test-Path $zipalign)) -or (-not (Test-Path $apksigner))) {
            throw "zipalign.exe or apksigner.bat not found under $($buildToolsDir.FullName)"
          }

          $signedApkDir = "src-tauri/gen/android/app/build/outputs/apk-signed"
          New-Item -Path $signedApkDir -ItemType Directory -Force | Out-Null

          $apkFiles = Get-ChildItem -Path "src-tauri/gen/android/app/build/outputs/apk" -Recurse -Filter "*release*.apk" | Where-Object { $_.Name -notlike "*-signed.apk" }
          if (-not $apkFiles -or $apkFiles.Count -eq 0) {
            throw "No release APK files found."
          }

          foreach ($apk in $apkFiles) {
            $baseName = [IO.Path]::GetFileNameWithoutExtension($apk.Name)
            $alignedApk = Join-Path $env:RUNNER_TEMP "$baseName-aligned.apk"
            $signedApk = Join-Path $signedApkDir "$baseName-signed.apk"

            & $zipalign -p -f 4 $apk.FullName $alignedApk
            if ($LASTEXITCODE -ne 0) {
              throw "zipalign failed: $($apk.FullName)"
            }

            & $apksigner sign `
              --ks $env:ANDROID_KEYSTORE_PATH `
              --ks-pass ("pass:{0}" -f $env:ANDROID_KEYSTORE_PASSWORD) `
              --ks-key-alias $env:ANDROID_KEY_ALIAS `
              --key-pass ("pass:{0}" -f $env:ANDROID_KEY_PASSWORD) `
              --out $signedApk `
              $alignedApk
            if ($LASTEXITCODE -ne 0) {
              throw "apksigner sign failed: $($apk.FullName)"
            }

            & $apksigner verify --verbose $signedApk
            if ($LASTEXITCODE -ne 0) {
              throw "apksigner verify failed: $signedApk"
            }
            Write-Host "Signed APK: $signedApk"
          }

      - name: Upload Android signed APK Artifact (上传已签名 APK)
        if: steps.targets.outputs.BUILD_ANDROID == 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        id: upload_apk
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-signed-${{ steps.hash.outputs.HASH }}
          path: src-tauri/gen/android/app/build/outputs/apk-signed/
        continue-on-error: true

      - name: Retry Upload Android signed APK Artifact
        if: steps.targets.outputs.BUILD_ANDROID == 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && steps.upload_apk.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-signed-${{ steps.hash.outputs.HASH }}
          path: src-tauri/gen/android/app/build/outputs/apk-signed/

  # ─────────────────────────────────────────────────────────────
  # Job 2: Windows EXE/MSI on Windows runner
  # Split from the old combined Windows job so Android/Windows can run in parallel.
  # ─────────────────────────────────────────────────────────────
  build-windows-selfhosted:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine build targets (确定构建目标)
        id: targets
        shell: pwsh
        run: |
          $android = "false"
          $windows = "true"
          "BUILD_ANDROID=$android" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "BUILD_WINDOWS=$windows" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Build Android=$android Windows=$windows (parallel Windows job / 并行 Windows job)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Ensure local Bun is available (确保本机 Bun 可用，版本锁定)
        shell: pwsh
        run: |
          $requiredVersion = "${{ env.BUN_VERSION }}"
          $bunCmd = Get-Command bun -ErrorAction SilentlyContinue
          $needInstall = $false

          if (-not $bunCmd -or ($bunCmd.Source -match '(?i)wsl|\\ubuntu\\')) {
            Write-Host "Bun not found or is WSL version."
            $needInstall = $true
          } else {
            $currentVersion = (bun --version 2>$null)
            if ($currentVersion -ne $requiredVersion) {
              Write-Host "Bun version mismatch: found $currentVersion, need $requiredVersion"
              $needInstall = $true
            } else {
              Write-Host "Found matching Bun $currentVersion at $($bunCmd.Source)"
            }
          }

          if ($needInstall) {
            Write-Host "Installing bun@$requiredVersion via npm..."
            npm install -g "bun@$requiredVersion"
            $npmPrefix = (npm config get prefix).Trim()
            if ($npmPrefix) {
              $env:Path = "$npmPrefix;$env:Path"
              "$npmPrefix" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            }
            $bunCmd = Get-Command bun -ErrorAction SilentlyContinue
            if (-not $bunCmd) { throw "Bun is unavailable after installation." }
            if ($bunCmd.Source -match '(?i)wsl|\\ubuntu\\') {
              throw "Detected WSL bun path: $($bunCmd.Source). Please use native Windows Bun."
            }
          }
          Write-Host "Using Bun from: $($bunCmd.Source)"
          bun --version

      - name: Rust diagnostics (Rust 诊断输出)
        shell: pwsh
        run: |
          Write-Host '=== Rust diagnostics / Rust 诊断输出 ==='
          Write-Host ('event_name={0}' -f '${{ github.event_name }}')
          Write-Host ('ref={0}' -f '${{ github.ref }}')
          Write-Host ('runner={0} os={1} arch={2}' -f $env:RUNNER_NAME, $env:RUNNER_OS, $env:RUNNER_ARCH)
          $currentUser = whoami
          Write-Host ('whoami={0}' -f $currentUser)
          Write-Host ('USERPROFILE={0}' -f $env:USERPROFILE)
          Write-Host ('HOME={0}' -f $env:HOME)
          Write-Host ('CARGO_HOME={0}' -f $env:CARGO_HOME)
          Write-Host ('RUSTUP_HOME={0}' -f $env:RUSTUP_HOME)

          $cargoBin = Join-Path $env:USERPROFILE '.cargo\bin'
          $cargoBinExists = Test-Path $cargoBin
          Write-Host ('cargoBin={0} exists={1}' -f $cargoBin, $cargoBinExists)

          foreach ($name in @('rustup.exe', 'rustc.exe', 'cargo.exe', 'rustup', 'rustc', 'cargo')) {
            $candidate = Join-Path $cargoBin $name
            $candidateExists = Test-Path $candidate
            Write-Host ('candidate={0} exists={1}' -f $candidate, $candidateExists)
          }

          Write-Host 'Get-Command (before prepend PATH)'
          foreach ($cmd in @('rustup', 'rustc', 'cargo')) {
            $resolved = Get-Command $cmd -ErrorAction SilentlyContinue
            if ($resolved) {
              Write-Host (' - {0} [{1}]' -f $cmd, $resolved.Source)
            } else {
              Write-Host (' - {0} [NOT_FOUND]' -f $cmd)
            }
          }

      - name: Use local Rust toolchain (使用本机 Rust 工具链，禁止 WSL)
        shell: pwsh
        run: |
          $preferredCargoHome = "D:\actions-runner\rust\cargo"
          $preferredRustupHome = "D:\actions-runner\rust\rustup"
          $preferredCargoBin = Join-Path $preferredCargoHome "bin"
          if (Test-Path $preferredCargoBin) {
            $env:CARGO_HOME = $preferredCargoHome
            $env:RUSTUP_HOME = $preferredRustupHome
            "CARGO_HOME=$preferredCargoHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "RUSTUP_HOME=$preferredRustupHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            $env:Path = "$preferredCargoBin;$env:Path"
            "$preferredCargoBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

          $cargoBin = Join-Path $env:USERPROFILE ".cargo\bin"
          if (Test-Path $cargoBin) {
            $env:Path = "$cargoBin;$env:Path"
            "$cargoBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

          $rustupCmd = Get-Command rustup -ErrorAction SilentlyContinue
          $rustcCmd = Get-Command rustc -ErrorAction SilentlyContinue
          $cargoCmd = Get-Command cargo -ErrorAction SilentlyContinue
          if ((-not $rustupCmd) -or (-not $rustcCmd) -or (-not $cargoCmd)) {
            throw "Rust toolchain not found on Windows runner."
          }

          if (($rustupCmd.Source -match '(?i)wsl|\\ubuntu\\') -or ($rustcCmd.Source -match '(?i)wsl|\\ubuntu\\') -or ($cargoCmd.Source -match '(?i)wsl|\\ubuntu\\')) {
            throw "Detected Rust command from WSL path. Please use native Windows Rust toolchain."
          }

          rustup default stable
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to select stable Rust toolchain. Please install stable locally first (例如: rustup toolchain install stable)."
          }

          rustup show active-toolchain
          rustc -vV
          cargo -V

      - name: Get short commit hash
        id: hash
        shell: pwsh
        run: |
          $short = $env:GITHUB_SHA.Substring(0, 7)
          "HASH=$short" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Resolve app version (解析应用版本)
        id: app_version
        shell: pwsh
        run: |
          $refName = "${{ github.ref_name }}"
          $appVersion = ""

          if ($refName.StartsWith("v")) {
            $appVersion = $refName.Substring(1)
          }

          if (-not $appVersion) {
            $packageVersion = (Get-Content -Path "package.json" -Raw | ConvertFrom-Json).version
            $appVersion = [string]$packageVersion
          }

          if ($appVersion.StartsWith("v")) {
            $appVersion = $appVersion.Substring(1)
          }

          if (-not $appVersion) {
            throw "Cannot resolve app version from tag or package.json."
          }

          "APP_VERSION=$appVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Resolved app version: $appVersion"

      - name: Clean stale node_modules (清理残留依赖，避免 bun 校验卡死)
        shell: pwsh
        run: |
          if (Test-Path node_modules) {
            Write-Host "Removing stale node_modules from previous run..."
            Remove-Item -Recurse -Force node_modules
          }

      - name: Clear bun global cache (清理 bun 全局缓存)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          try {
            Write-Host "Running bun pm cache rm (best effort)..."
            bun pm cache rm
          } catch {
            Write-Warning "bun pm cache rm failed: $($_.Exception.Message)"
          }

          $bunCacheDir = Join-Path $env:USERPROFILE ".bun\install\cache"
          if (Test-Path $bunCacheDir) {
            try {
              Write-Host "Removing bun global cache directory: $bunCacheDir"
              Remove-Item -Recurse -Force $bunCacheDir -ErrorAction Stop
            } catch {
              Write-Warning "Failed to remove bun global cache directory: $($_.Exception.Message)"
            }
          } else {
            Write-Host "Bun global cache directory not found, skip cleanup."
          }

      - name: Install dependencies with isolated cache and retry (安装依赖：隔离缓存 + 重试)
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = "Stop"

          function Invoke-BunInstallWithCache {
            param(
              [Parameter(Mandatory = $true)][string]$CacheDir,
              [Parameter(Mandatory = $true)][string]$AttemptLabel,
              [int]$TimeoutSeconds = 180
            )

            if (Test-Path $CacheDir) {
              Remove-Item -Recurse -Force $CacheDir -ErrorAction SilentlyContinue
            }
            New-Item -ItemType Directory -Force -Path $CacheDir | Out-Null

            $env:BUN_INSTALL_CACHE_DIR = $CacheDir
            $arguments = @("install", "--cache-dir", $CacheDir)
            Write-Host "[$AttemptLabel] Running: bun $($arguments -join ' ')"

            $commandText = "bun $($arguments -join ' ')"
            $process = Start-Process -FilePath "cmd.exe" -ArgumentList "/c", $commandText -PassThru
            $finished = $process.WaitForExit($TimeoutSeconds * 1000)

            if (-not $finished) {
              Write-Warning "[$AttemptLabel] bun install timed out after $TimeoutSeconds seconds."
              try {
                & taskkill /PID $process.Id /T /F | Out-Null
              } catch {
                Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              }
              throw "bun install timeout in $AttemptLabel"
            }

            if ($process.ExitCode -ne 0) {
              throw "bun install failed in $AttemptLabel with exit code $($process.ExitCode)"
            }
          }

          $baseCacheDir = Join-Path $env:RUNNER_TEMP "bun-install-cache"
          $firstAttemptCacheDir = Join-Path $baseCacheDir "attempt-1"
          $secondAttemptCacheDir = Join-Path $baseCacheDir "attempt-2"

          try {
            Invoke-BunInstallWithCache -CacheDir $firstAttemptCacheDir -AttemptLabel "attempt 1 / 第一次"
          } catch {
            Write-Warning "First install attempt failed: $($_.Exception.Message)"
            Write-Host "Retry bun install / 重试 bun install with fresh isolated cache."
            Invoke-BunInstallWithCache -CacheDir $secondAttemptCacheDir -AttemptLabel "attempt 2 / 第二次"
          }

          "EXOMIND_SKIP_BUN_INSTALL=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "EXOMIND_SKIP_BUN_INSTALL=1 (reuse bootstrapped dependencies / 复用前置依赖安装)"

      - name: Build frontend dist for Windows cargo build (为 Windows cargo 构建预先产出前端 dist)
        if: steps.targets.outputs.BUILD_WINDOWS == 'true'
        shell: pwsh
        run: bun run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_APP_VERSION: ${{ steps.app_version.outputs.APP_VERSION }}
          VITE_BUILD_HASH: ${{ steps.hash.outputs.HASH }}

      # ─── Windows build ──────────────────────────────────────

      - name: Build Windows EXE binary (构建 Windows EXE 可执行文件)
        if: steps.targets.outputs.BUILD_WINDOWS == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Build EXE via cargo to avoid a second tauri beforeBuild bun install in CI.
          #（使用 cargo 构建 EXE，避免 CI 中 tauri beforeBuild 再次触发 bun install 卡死）
          cargo build --manifest-path src-tauri/Cargo.toml --release -p exomind --features custom-protocol
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_APP_VERSION: ${{ steps.app_version.outputs.APP_VERSION }}
          VITE_BUILD_HASH: ${{ steps.hash.outputs.HASH }}

      - name: Prepare MSI prerequisites (准备 MSI 前置检查)
        if: steps.targets.outputs.BUILD_WINDOWS == 'true'
        id: msi_prereq
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $msiReady = $true
          $runnerIdentity = (whoami).Trim().ToLowerInvariant()
          Write-Host "Runner identity / 运行账号: $runnerIdentity"

          $wshKey = "HKCU:\Software\Microsoft\Windows Script Host\Settings"
          try {
            New-Item -Path $wshKey -Force | Out-Null
            New-ItemProperty -Path $wshKey -Name Enabled -PropertyType DWord -Value 1 -Force | Out-Null
            $enabled = (Get-ItemProperty -Path $wshKey -Name Enabled -ErrorAction SilentlyContinue).Enabled
            Write-Host "Windows Script Host (WSH) Enabled=$enabled"
          } catch {
            Write-Warning "Unable to set WSH registry key: $($_.Exception.Message)"
            $msiReady = $false
          }

          $probePath = Join-Path $env:RUNNER_TEMP "wix-vbscript-probe.vbs"
          Set-Content -Path $probePath -Value 'WScript.Echo "VBSCRIPT_OK"' -Encoding ASCII

          try {
            & cscript.exe //NoLogo $probePath
            Write-Host "cscript probe exit code=$LASTEXITCODE"
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "cscript probe returned non-zero exit code: $LASTEXITCODE"
              $msiReady = $false
            }
          } catch {
            Write-Warning "cscript probe failed: $($_.Exception.Message)"
            $msiReady = $false
          }

          try {
            $service = Get-Service -Name msiserver -ErrorAction Stop
            Write-Host "Windows Installer service status=$($service.Status) startType=$($service.StartType)"
            if ($service.Status -ne "Running") {
              Start-Service -Name msiserver -ErrorAction Stop
              Start-Sleep -Seconds 1
              $service = Get-Service -Name msiserver -ErrorAction Stop
              Write-Host "Windows Installer service status after start=$($service.Status)"
            }
          } catch {
            Write-Warning "Windows Installer service probe failed: $($_.Exception.Message)"
            $msiReady = $false
          }

          try {
            $null = New-Object -ComObject WindowsInstaller.Installer
            Write-Host "WindowsInstaller COM probe: OK"
          } catch {
            Write-Warning "WindowsInstaller COM probe failed: $($_.Exception.Message)"
            $msiReady = $false
          }

          "MSI_READY=$($msiReady.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "MSI_READY=$($msiReady.ToString().ToLower())"

      - name: Build Windows MSI installer (构建 Windows MSI 安装包)
        if: steps.targets.outputs.BUILD_WINDOWS == 'true' && steps.msi_prereq.outputs.MSI_READY == 'true'
        run: bun tauri build --bundles msi
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_APP_VERSION: ${{ steps.app_version.outputs.APP_VERSION }}
          VITE_BUILD_HASH: ${{ steps.hash.outputs.HASH }}
          RUST_LOG: tauri_bundler=debug

      - name: Recover Windows MSI artifact via WiX light fallback (通过 WiX light 回退恢复 MSI)
        if: steps.targets.outputs.BUILD_WINDOWS == 'true' && steps.msi_prereq.outputs.MSI_READY == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function Find-FirstExistingPath([string[]]$Candidates) {
            foreach ($candidate in $Candidates) {
              if (Test-Path $candidate) {
                return (Resolve-Path $candidate).Path
              }
            }
            return $null
          }

          $existingMsiDirs = @(
            "target/release/bundle/msi",
            "src-tauri/target/release/bundle/msi"
          )
          foreach ($msiDir in $existingMsiDirs) {
            if (-not (Test-Path $msiDir)) { continue }
            $existingMsi = Get-ChildItem -Path $msiDir -Filter "*.msi" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($existingMsi) {
              Write-Host "MSI already exists, skip WiX fallback: $($existingMsi.FullName)"
              exit 0
            }
          }

          $wixRoot = Find-FirstExistingPath @(
            "target/.tauri/WixTools314",
            "src-tauri/target/.tauri/WixTools314"
          )
          $wixBuildDir = Find-FirstExistingPath @(
            "target/release/wix/x64",
            "src-tauri/target/release/wix/x64"
          )

          if (-not $wixRoot -or -not $wixBuildDir) {
            Write-Warning "WiX fallback inputs are missing. Skip MSI recovery."
            exit 0
          }

          $lightExe = Join-Path $wixRoot "light.exe"
          $wixUtilExt = Join-Path $wixRoot "WixUtilExtension.dll"
          $wixUiExt = Join-Path $wixRoot "WixUIExtension.dll"
          $localeFile = Join-Path $wixBuildDir "locale.wxl"
          $wixObjFiles = Get-ChildItem -Path $wixBuildDir -Filter "*.wixobj" -File -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName

          foreach ($requiredPath in @($lightExe, $wixUtilExt, $wixUiExt, $localeFile)) {
            if (-not (Test-Path $requiredPath)) {
              throw "Missing WiX fallback dependency: $requiredPath"
            }
          }
          if (-not $wixObjFiles -or $wixObjFiles.Count -eq 0) {
            throw "Missing .wixobj files for WiX fallback under $wixBuildDir"
          }

          $releaseDir = Split-Path -Parent (Split-Path -Parent $wixBuildDir)
          $bundleDir = Join-Path $releaseDir "bundle/msi"
          New-Item -ItemType Directory -Force -Path $bundleDir | Out-Null

          $appVersion = "${{ steps.app_version.outputs.APP_VERSION }}"
          $outputMsi = Join-Path $bundleDir "ExoMind_${appVersion}_x64_en-US.msi"
          $lightArgs = @(
            "-ext", $wixUtilExt,
            "-ext", $wixUiExt,
            "-sval",
            "-o", $outputMsi,
            "-cultures:en-us",
            "-loc", $localeFile
          ) + $wixObjFiles

          Write-Host "Recover MSI with WiX light fallback / 通过 WiX light 回退恢复 MSI"
          Write-Host "Command: $lightExe $($lightArgs -join ' ')"
          & $lightExe @lightArgs
          if ($LASTEXITCODE -ne 0) {
            throw "WiX light fallback failed with exit code $LASTEXITCODE"
          }
          if (-not (Test-Path $outputMsi)) {
            throw "WiX light fallback completed but MSI was not created: $outputMsi"
          }
          Write-Host "Recovered MSI artifact: $outputMsi"

      - name: Skip MSI build when prerequisites are unavailable (前置检查失败时跳过 MSI)
        if: steps.targets.outputs.BUILD_WINDOWS == 'true' && steps.msi_prereq.outputs.MSI_READY != 'true'
        shell: pwsh
        run: |
          Write-Warning "MSI prerequisites are unavailable on this runner. Skipping MSI build to keep EXE/APK pipeline stable."

      - name: Build exomind-rt runtime (构建 exomind-rt 运行时二进制)
        if: steps.targets.outputs.BUILD_WINDOWS == 'true'
        shell: pwsh
        run: cargo build --release -p exomind-runtime

      - name: Package exomind-rt runtime (打包 exomind-rt 运行时产物)
        if: steps.targets.outputs.BUILD_WINDOWS == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/runtime | Out-Null
          Copy-Item -Path target/release/exomind-rt.exe -Destination artifacts/runtime/exomind-rt-windows-x64.exe -Force

      - name: Upload Windows runtime Artifact (上传 Windows runtime)
        if: steps.targets.outputs.BUILD_WINDOWS == 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: windows-runtime-${{ steps.hash.outputs.HASH }}
          path: artifacts/runtime/exomind-rt-windows-x64.exe

      - name: Upload Windows EXE Artifact (上传 EXE)
        if: steps.targets.outputs.BUILD_WINDOWS == 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe-${{ steps.hash.outputs.HASH }}
          path: |
            target/release/exomind.exe
            target/release/ExoMind.exe
            src-tauri/target/release/exomind.exe
            src-tauri/target/release/ExoMind.exe
          if-no-files-found: warn

      - name: Upload Windows MSI Artifact (上传 MSI)
        if: steps.targets.outputs.BUILD_WINDOWS == 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi-${{ steps.hash.outputs.HASH }}
          path: |
            target/release/bundle/msi/
            src-tauri/target/release/bundle/msi/
          if-no-files-found: ignore

  build-macos:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Bun
        run: npm install -g bun

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Get short commit hash
        id: hash
        run: echo "HASH=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Resolve app version
        id: app_version
        run: |
          ref_name="${{ github.ref_name }}"
          app_version=""

          if [[ "$ref_name" == v* ]]; then
            app_version="${ref_name#v}"
          fi

          if [ -z "$app_version" ]; then
            app_version="$(jq -r '.version' package.json)"
          fi

          app_version="${app_version#v}"

          if [ -z "$app_version" ]; then
            echo "Cannot resolve app version from tag or package.json." >&2
            exit 1
          fi

          echo "APP_VERSION=$app_version" >> "$GITHUB_OUTPUT"
          echo "Resolved app version: $app_version"

      - name: Install dependencies
        run: bun install

      - name: Build macOS app (构建 macOS 应用)
        run: npx tauri build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_APP_VERSION: ${{ steps.app_version.outputs.APP_VERSION }}
          VITE_BUILD_HASH: ${{ steps.hash.outputs.HASH }}

      - name: Build exomind-rt runtime (构建 exomind-rt 运行时二进制)
        run: cargo build --release -p exomind-runtime

      - name: Package exomind-rt runtime (打包 exomind-rt 运行时产物)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/runtime
          cp target/release/exomind-rt artifacts/runtime/exomind-rt-macos-aarch64
          tar -czf artifacts/runtime/exomind-rt-macos-aarch64.tar.gz -C artifacts/runtime exomind-rt-macos-aarch64

      - name: Upload macOS runtime Artifact (上传 macOS runtime)
        uses: actions/upload-artifact@v4
        with:
          name: macos-runtime-${{ steps.hash.outputs.HASH }}
          path: artifacts/runtime/exomind-rt-macos-aarch64.tar.gz

      - name: Upload macOS DMG Artifact (上传 DMG)
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-${{ steps.hash.outputs.HASH }}
          path: |
            target/release/bundle/dmg/
            src-tauri/target/release/bundle/dmg/
          if-no-files-found: ignore

  build-linux:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Bun
        run: npm install -g bun

      - name: Install Linux system dependencies (安装 Linux 系统依赖)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libsoup-3.0-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Get short commit hash
        id: hash
        run: echo "HASH=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Resolve app version
        id: app_version
        run: |
          ref_name="${{ github.ref_name }}"
          app_version=""

          if [[ "$ref_name" == v* ]]; then
            app_version="${ref_name#v}"
          fi

          if [ -z "$app_version" ]; then
            app_version="$(jq -r '.version' package.json)"
          fi

          app_version="${app_version#v}"

          if [ -z "$app_version" ]; then
            echo "Cannot resolve app version from tag or package.json." >&2
            exit 1
          fi

          echo "APP_VERSION=$app_version" >> "$GITHUB_OUTPUT"
          echo "Resolved app version: $app_version"

      - name: Install dependencies
        run: bun install

      - name: Build Linux app (构建 Linux 应用)
        run: npx tauri build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_APP_VERSION: ${{ steps.app_version.outputs.APP_VERSION }}
          VITE_BUILD_HASH: ${{ steps.hash.outputs.HASH }}

      - name: Build exomind-rt runtime (构建 exomind-rt 运行时二进制)
        run: cargo build --release -p exomind-runtime

      - name: Package exomind-rt runtime (打包 exomind-rt 运行时产物)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/runtime
          cp target/release/exomind-rt artifacts/runtime/exomind-rt-linux-x64
          tar -czf artifacts/runtime/exomind-rt-linux-x64.tar.gz -C artifacts/runtime exomind-rt-linux-x64

      - name: Upload Linux runtime Artifact (上传 Linux runtime)
        uses: actions/upload-artifact@v4
        with:
          name: linux-runtime-${{ steps.hash.outputs.HASH }}
          path: artifacts/runtime/exomind-rt-linux-x64.tar.gz

      - name: Upload Linux DEB Artifact (上传 DEB)
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb-${{ steps.hash.outputs.HASH }}
          path: |
            target/release/bundle/deb/
            src-tauri/target/release/bundle/deb/
          if-no-files-found: ignore

      - name: Upload Linux AppImage Artifact (上传 AppImage)
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage-${{ steps.hash.outputs.HASH }}
          path: |
            target/release/bundle/appimage/
            src-tauri/target/release/bundle/appimage/
          if-no-files-found: ignore

  create-release:
    needs:
      [
        build-android-selfhosted,
        build-windows-selfhosted,
        build-macos,
        build-linux,
      ]
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.build-android-selfhosted.result == 'success' &&
      needs.build-windows-selfhosted.result == 'success'
    steps:
      - name: Checkout repository (检出代码以生成 release notes)
        uses: actions/checkout@v4

      - name: Setup Bun (安装 Bun 以生成 release notes)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: List Files
        run: ls -la release-files/

      - name: Resolve release metadata (解析发布元信息)
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "title=Preview ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Normalize release artifact names (统一发布产物命名)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob globstar

          version="${{ steps.meta.outputs.version }}"
          source_dir="release-files"
          output_dir="release-assets"
          mkdir -p "$output_dir"

          exe_files=("$source_dir"/**/*.exe)
          if (( ${#exe_files[@]} == 0 )); then
            echo "::error::Missing Windows EXE artifact."
            exit 1
          fi
          app_exe=""
          for exe in "${exe_files[@]}"; do
            lower_name="$(basename "$exe" | tr '[:upper:]' '[:lower:]')"
            if [[ "$lower_name" == *"exomind-rt"* ]]; then
              continue
            fi
            app_exe="$exe"
            if [[ "$lower_name" == "exomind.exe" || "$lower_name" == *"setup"* || "$lower_name" == *"installer"* ]]; then
              break
            fi
          done
          if [[ -z "$app_exe" ]]; then
            echo "::error::Cannot find non-runtime Windows EXE artifact."
            exit 1
          fi
          cp "$app_exe" "$output_dir/ExoMind-${version}-windows-x64-setup.exe"

          msi_files=("$source_dir"/**/*.msi)
          if (( ${#msi_files[@]} > 0 )); then
            cp "${msi_files[0]}" "$output_dir/ExoMind-${version}-windows-x64-installer.msi"
          fi

          apk_files=("$source_dir"/**/*signed.apk)
          if (( ${#apk_files[@]} == 0 )); then
            apk_files=("$source_dir"/**/*.apk)
          fi

          arm64_apk=""
          x86_apk=""
          for apk in "${apk_files[@]}"; do
            file_name="$(basename "$apk" | tr '[:upper:]' '[:lower:]')"
            if [[ -z "$arm64_apk" && ( "$file_name" == *"arm64"* || "$file_name" == *"aarch64"* || "$file_name" == *"arm64-v8a"* ) ]]; then
              arm64_apk="$apk"
              continue
            fi
            if [[ -z "$x86_apk" && ( "$file_name" == *"i686"* || "$file_name" == *"x86"* ) && "$file_name" != *"x86_64"* ]]; then
              x86_apk="$apk"
            fi
          done

          if [[ -z "$arm64_apk" ]]; then
            echo "::error::Missing Android arm64 APK artifact."
            exit 1
          fi
          if [[ -z "$x86_apk" ]]; then
            echo "::error::Missing Android x86 APK artifact."
            exit 1
          fi

          cp "$arm64_apk" "$output_dir/ExoMind-${version}-android-arm64.apk"
          cp "$x86_apk" "$output_dir/ExoMind-${version}-android-x86.apk"

          dmg_files=("$source_dir"/**/*.dmg)
          if (( ${#dmg_files[@]} > 0 )); then
            macos_aarch64_dmg=""
            macos_x64_dmg=""

            for dmg in "${dmg_files[@]}"; do
              file_name="$(basename "$dmg" | tr '[:upper:]' '[:lower:]')"
              if [[ -z "$macos_x64_dmg" && ( "$file_name" == *"x64"* || "$file_name" == *"x86_64"* || "$file_name" == *"amd64"* ) ]]; then
                macos_x64_dmg="$dmg"
                continue
              fi
              if [[ -z "$macos_aarch64_dmg" && ( "$file_name" == *"arm64"* || "$file_name" == *"aarch64"* || "$file_name" == *"universal"* ) ]]; then
                macos_aarch64_dmg="$dmg"
              fi
            done

            if [[ -z "$macos_aarch64_dmg" ]]; then
              macos_aarch64_dmg="${dmg_files[0]}"
            fi

            cp "$macos_aarch64_dmg" "$output_dir/ExoMind-${version}-macos-aarch64.dmg"

            if [[ -n "$macos_x64_dmg" ]]; then
              cp "$macos_x64_dmg" "$output_dir/ExoMind-${version}-macos-x64.dmg"
            fi
          fi

          deb_files=("$source_dir"/**/*.deb)
          if (( ${#deb_files[@]} > 0 )); then
            cp "${deb_files[0]}" "$output_dir/ExoMind-${version}-linux-x64.deb"
          fi

          appimage_files=("$source_dir"/**/*.AppImage "$source_dir"/**/*.appimage)
          if (( ${#appimage_files[@]} > 0 )); then
            cp "${appimage_files[0]}" "$output_dir/ExoMind-${version}-linux-x64.AppImage"
          fi

          runtime_win_files=("$source_dir"/**/exomind-rt-windows-x64.exe)
          if (( ${#runtime_win_files[@]} > 0 )); then
            cp "${runtime_win_files[0]}" "$output_dir/ExoMind-RT-${version}-windows-x64.exe"
          fi

          runtime_macos_files=("$source_dir"/**/exomind-rt-macos-aarch64.tar.gz)
          if (( ${#runtime_macos_files[@]} > 0 )); then
            cp "${runtime_macos_files[0]}" "$output_dir/ExoMind-RT-${version}-macos-aarch64.tar.gz"
          fi

          runtime_linux_files=("$source_dir"/**/exomind-rt-linux-x64.tar.gz)
          if (( ${#runtime_linux_files[@]} > 0 )); then
            cp "${runtime_linux_files[0]}" "$output_dir/ExoMind-RT-${version}-linux-x64.tar.gz"
          fi

      - name: List Normalized Files
        run: ls -la release-assets/

      - name: Generate release manifest (生成 release manifest)
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.meta.outputs.version }}"
          output_dir="release-assets"
          generated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          assets_json='{}'

          add_asset() {
            local key="$1"
            local file="$2"
            if [[ ! -f "$file" ]]; then
              return
            fi

            local size sha256 name
            size="$(stat --format=%s "$file")"
            sha256="$(sha256sum "$file" | awk '{print $1}')"
            name="$(basename "$file")"
            assets_json="$(echo "$assets_json" | jq \
              --arg key "$key" \
              --arg name "$name" \
              --argjson size "$size" \
              --arg sha256 "$sha256" \
              '. + {($key): {name: $name, size: $size, sha256: $sha256}}')"
          }

          add_asset "windows-x64-setup" "$output_dir/ExoMind-${version}-windows-x64-setup.exe"
          add_asset "windows-x64-installer" "$output_dir/ExoMind-${version}-windows-x64-installer.msi"
          add_asset "android-arm64" "$output_dir/ExoMind-${version}-android-arm64.apk"
          add_asset "android-x86" "$output_dir/ExoMind-${version}-android-x86.apk"
          add_asset "macos-aarch64" "$output_dir/ExoMind-${version}-macos-aarch64.dmg"
          add_asset "macos-x64" "$output_dir/ExoMind-${version}-macos-x64.dmg"
          add_asset "linux-x64-appimage" "$output_dir/ExoMind-${version}-linux-x64.AppImage"
          add_asset "linux-x64-deb" "$output_dir/ExoMind-${version}-linux-x64.deb"
          add_asset "runtime-windows-x64" "$output_dir/ExoMind-RT-${version}-windows-x64.exe"
          add_asset "runtime-macos-aarch64" "$output_dir/ExoMind-RT-${version}-macos-aarch64.tar.gz"
          add_asset "runtime-linux-x64" "$output_dir/ExoMind-RT-${version}-linux-x64.tar.gz"

          jq -n \
            --arg version "$version" \
            --arg tag "${GITHUB_REF_NAME}" \
            --arg commit "${GITHUB_SHA}" \
            --arg generated_at "$generated_at" \
            --argjson assets "$assets_json" \
            '{version: $version, tag: $tag, commit: $commit, generated_at: $generated_at, assets: $assets}' \
            > "$output_dir/exomind-release-manifest.json"

      - name: Generate release notes (生成 release notes)
        run: >
          bun scripts/dev/generate-release-notes.ts
          --repo ${{ github.repository }}
          --tag ${{ github.ref_name }}
          --title "${{ steps.meta.outputs.title }}"
          --manifest release-assets/exomind-release-manifest.json
          --output .tmp/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or Update GitHub Release (创建或更新 GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.meta.outputs.title }}
          body_path: .tmp/release-notes.md
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  promote-release:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Promote existing GitHub Release (晋升既有 GitHub Release)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = `${{ github.event.inputs.promote_tag }}`.trim();
            if (!/^v\d+\.\d+\.\d+$/.test(tag)) {
              core.setFailed(`Invalid promote_tag: ${tag}`);
              return;
            }

            const { owner, repo } = context.repo;
            const release = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: release.data.id,
              tag_name: tag,
              draft: false,
              prerelease: false,
              make_latest: 'true',
              name: `Release ${tag}`,
            });
