[package]
name = "exomind-core"
version = "0.1.0"
edition = "2024"
description = "Isolated append-only Beta local commit core"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
thiserror = "1"

[dev-dependencies]
tempfile = "3"
