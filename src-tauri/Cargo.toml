[package]
name = "exomind"
version = "0.6.0-alpha05"
description = "ExoMind - Your Life Update Assistant"
authors = ["exo-mind.ai"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "exomind_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[features]
# Ensure plain `cargo build --release` embeds frontend assets
# instead of falling back to devUrl (localhost).
default = ["custom-protocol", "alpha-legacy-runtime"]
custom-protocol = ["tauri/custom-protocol"]

# Preserve the historical Alpha runtime path as the default application mode.
alpha-legacy-runtime = ["dep:exomind-runtime"]

# Beta uses its Native Host/Core route without compiling the Alpha Runtime path.
beta-native-only = []

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
sha2 = "=0.10.9"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"

tokio = { version = "1", features = ["rt-multi-thread", "sync", "net", "time"] }
tungstenite = "0.21"
futures-util = "0.3"
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-native-roots"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
tauri-plugin-mcp-bridge = "0.9"
thiserror = "1"
exomind-runtime = { path = "../crates/exomind-runtime", optional = true }
exomind-core = { path = "../crates/exomind-core" }
exomind-beta-host = { path = "../crates/exomind-beta-host" }
exomind-android-keepalive = { path = "../crates/exomind-android-keepalive" }
exomind-android-clipboard = { path = "../crates/exomind-android-clipboard" }
exomind-android-keep-awake = { path = "../crates/exomind-android-keep-awake" }
exomind-android-timeblock-end-alert = { path = "../crates/exomind-android-timeblock-end-alert" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tauri-plugin-global-shortcut = "2"
enigo = { version = "0.3", features = ["serde"] }
log = "0.4"
tauri-plugin-log = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_FileSystem",
] }
