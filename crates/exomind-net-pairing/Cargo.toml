[package]
name = "exomind-net-pairing"
version = "0.1.0"
edition = "2021"
description = "Reticulum-based device discovery and pairing for ExoMind"

[dependencies]
reticulum = { path = "../../../ExoNet-Reticulum/src" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
thiserror = "1"
chrono = "0.4"
hex = "0.4"
