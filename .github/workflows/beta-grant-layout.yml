name: Beta Grant Layout

on:
  workflow_dispatch:
  push:
    branches: [dev, dev-0.6]
    paths: &layout_paths
      - '.github/workflows/beta-grant-layout.yml'
      - 'src/beta/BetaAgentGrantsPanel.tsx'
      - 'src/beta/agent-grants-*.ts'
      - 'src/components/ui/**'
      - 'src/index.css'
      - 'src/beta/beta-ui.css'
      - 'tailwind.config.js'
      - 'tests/e2e/fixtures/beta-agent-grants.*'
      - 'tests/e2e/beta-workspace-ui.test.ts'
      - 'tests/e2e/*beta-workspace.config.ts'
      - 'package.json'
      - 'bun.lock'
  pull_request:
    paths: *layout_paths

permissions:
  contents: read

concurrency:
  group: beta-grant-layout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  narrow-grant-layout:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Install Edge for the renderer layout check
        run: node node_modules/@playwright/test/cli.js install --with-deps msedge
      - name: Check readable identity and reachable actions with mouse and touch
        env:
          EXOMIND_UI_EVIDENCE_DIR: ${{ runner.temp }}/beta-grant-layout
        run: node node_modules/@playwright/test/cli.js test --config tests/e2e/playwright.beta-workspace.config.ts --grep "grant card keeps" --project phone-touch --project desktop-dark
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: beta-grant-layout-${{ github.sha }}
          path: ${{ runner.temp }}/beta-grant-layout
          if-no-files-found: warn
          retention-days: 7
