name: Beta Build Validation

# Internal build artifacts only. This name is intentionally NOT the
# "Build & Release" name watched by release-pages.yml.
on:
  push:
    branches:
      - dev-0.6
    paths:
      - .github/beta-build-candidate.json
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact immutable 40-hex candidate source commit
        required: true
        type: string
        default: 85f7df92d0eccf1de624ab9220d4d8944797f28b
      expected_sha:
        description: Exact 40-hex source commit; must equal source_ref
        required: true
        type: string
        default: 85f7df92d0eccf1de624ab9220d4d8944797f28b
      expected_version:
        description: Canonical Beta config version; never inferred from a branch
        required: true
        type: string
        default: 0.6.0-beta16
      android_only:
        description: Retry Android only while retaining desktop evidence for the same immutable source
        required: false
        type: boolean
        default: false
      android_test_package_suffix:
        description: Installable test-only Android package suffix that does not replace Beta25
        required: false
        type: string
        default: ''
      android_build_profile:
        description: Android profile for same-source size comparison
        required: false
        type: choice
        options:
          - debug
          - release
        default: debug

permissions:
  contents: read

concurrency:
  group: beta-build-validation-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  BUN_VERSION: '1.3.8'
  RUST_TOOLCHAIN: stable
  CARGO_BUILD_JOBS: '1'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_DEV_INCREMENTAL: 'false'
  CARGO_PROFILE_DEV_CODEGEN_UNITS: '16'
  CARGO_TARGET_DIR: ${{ github.workspace }}/target/beta-validation
  EXOMIND_SKIP_BUN_INSTALL: '1'

jobs:
  resolve-source:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.request.outputs.sha }}
      version: ${{ steps.request.outputs.version }}
      android_test_package_suffix: ${{ steps.request.outputs.android_test_package_suffix }}
      recipe_sha: ${{ steps.request.outputs.recipe_sha }}
      identifier: ${{ steps.identity.outputs.identifier }}
      version_code: ${{ steps.identity.outputs.version_code }}
      config_hash: ${{ steps.identity.outputs.config_hash }}
      cargo_lock_hash: ${{ steps.identity.outputs.cargo_lock_hash }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: recipe
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Validate explicit candidate request and workflow recipe
        id: request
        working-directory: recipe
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          ANDROID_TEST_PACKAGE_SUFFIX: ${{ inputs.android_test_package_suffix || '' }}
        run: bun scripts/dev/beta-build-request.ts resolve-request
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.request.outputs.sha }}
          path: candidate
          persist-credentials: false
      - name: Verify exact candidate checkout and Beta identity
        id: identity
        working-directory: recipe
        env:
          SOURCE_SHA: ${{ steps.request.outputs.sha }}
          EXPECTED_VERSION: ${{ steps.request.outputs.version }}
          WORKFLOW_RECIPE_SHA: ${{ steps.request.outputs.recipe_sha }}
          CANDIDATE_DIR: ${{ github.workspace }}/candidate
        run: bun scripts/dev/beta-build-request.ts verify-candidate

  desktop:
    needs: resolve-source
    if: ${{ inputs.android_only != true }}
    name: Beta ${{ matrix.label }} build
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            executable: exomind.exe
          - label: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            executable: exomind
          - label: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            executable: exomind
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      SOURCE_SHA: ${{ needs.resolve-source.outputs.sha }}
      WORKFLOW_RECIPE_SHA: ${{ needs.resolve-source.outputs.recipe_sha }}
      BETA_VERSION: ${{ needs.resolve-source.outputs.version }}
      BETA_CONFIG_HASH: ${{ needs.resolve-source.outputs.config_hash }}
      CARGO_LOCK_HASH: ${{ needs.resolve-source.outputs.cargo_lock_hash }}
      VITE_APP_VERSION: ${{ needs.resolve-source.outputs.version }}
      VITE_BUILD_HASH: ${{ needs.resolve-source.outputs.sha }}
      BUILD_LABEL: ${{ matrix.label }}
      BUILD_TARGET: ${{ matrix.target }}
      BUILD_EXECUTABLE: ${{ matrix.executable }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - name: Linux desktop prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev librsvg2-dev patchelf libssl-dev libsoup-3.0-dev
      - name: Bound Windows linker parallelism
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sysroot = (rustc --print sysroot).Trim()
          $linker = Join-Path $sysroot 'lib/rustlib/x86_64-pc-windows-msvc/bin/rust-lld.exe'
          if (-not (Test-Path -LiteralPath $linker -PathType Leaf)) { throw 'Owned Rust toolchain lld-link is missing' }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" >> $env:GITHUB_ENV
          'RUSTFLAGS=-C linker-flavor=lld-link -C link-arg=/threads:1 -C link-arg=/DEBUG:NONE' >> $env:GITHUB_ENV
      - name: Install frozen frontend dependencies (no lifecycle scripts)
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify checkout and Beta configuration before building
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process'; import {createHash} from 'node:crypto';
          const hash = file => createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          assert.equal(execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(), process.env.SOURCE_SHA);
          assert.equal(hash('src-tauri/tauri.beta.conf.json'), process.env.BETA_CONFIG_HASH);
          assert.equal(hash('Cargo.lock'), process.env.CARGO_LOCK_HASH);
          const config=JSON.parse(fs.readFileSync('src-tauri/tauri.beta.conf.json','utf8'));
          assert.equal(config.identifier,'com.exomind.app.v06.beta'); assert.equal(config.version,process.env.BETA_VERSION);
          NODE
      - name: Build embedded Beta debug executable (no installer/signing/publishing)
        shell: bash
        run: node node_modules/@tauri-apps/cli/tauri.js build --ci --debug --no-bundle --target "${{ matrix.target }}" --config src-tauri/tauri.beta.conf.json -- --locked --no-default-features --features custom-protocol,beta-native-only
      - name: Check Windows export source regressions for Beta20 and later
        if: runner.os == 'Windows'
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { execFileSync } from 'node:child_process';
          const version = process.env.BETA_VERSION.match(/^0\.6\.0-beta([1-9][0-9]*)$/);
          assert.ok(version, 'The source resolver must supply a canonical Beta version');
          if (BigInt(version[1]) < 20n) {
            console.log('Legacy candidate: export regressions were not part of this frozen source.');
          } else {
            const cases = [
              { filter: 'beta_native::profile_archive', names: [
                'restart_abandons_a_process_exit_partial_spool_and_admits_a_new_task',
                'restart_abandons_a_sealed_spool_whose_receipt_was_not_journaled',
                'abandon_refuses_a_partial_spool_replaced_after_process_exit',
              ] },
              { filter: 'beta_native::user_export', names: [
                'restart_projects_pending_export_to_interrupted_without_saved_receipt',
                'restart_preserves_a_private_stage_not_bound_to_a_creation_record',
                'restart_preserves_a_uuid_named_manifest_temporary_without_creation_proof',
              ] },
            ];
            const results = [];
            const reportPath = path.join(process.env.RUNNER_TEMP, 'beta-native-export-source-tests.json');
            const report = { scope: 'source-regressions', source_sha: process.env.SOURCE_SHA,
              workflow_recipe_sha: process.env.WORKFLOW_RECIPE_SHA, results, candidate_ui_tested: false };
            fs.writeFileSync(reportPath, JSON.stringify(report, null, 2));
            for (const entry of cases) {
              const progress = { filter: entry.filter, status: 'running', required_cases: entry.names };
              results.push(progress);
              try {
              const output = execFileSync('cargo', ['test', '--locked', '-p', 'exomind',
                '--target', process.env.BUILD_TARGET, '--no-default-features',
                '--features', 'custom-protocol,beta-native-only', '--lib', entry.filter,
                '--', '--nocapture', '--test-threads=1'], {
                encoding: 'utf8', timeout: 1200000, maxBuffer: 32 * 1024 * 1024,
                env: { ...process.env, TAURI_CONFIG: fs.readFileSync('src-tauri/tauri.beta.conf.json', 'utf8') },
              });
              const matches = [...output.matchAll(/test result: ok\. (\d+) passed; (\d+) failed; (\d+) ignored;/g)];
              assert.equal(matches.length, 1, 'One result must belong to each selected Native module');
              assert.ok(Number(matches[0][1]) > 0);
              assert.equal(Number(matches[0][2]), 0);
              assert.equal(Number(matches[0][3]), 0);
              for (const name of entry.names) assert.ok(output.includes(name), `Missing recovery regression: ${name}`);
              process.stdout.write(output);
              progress.status = 'passed';
              progress.passed = Number(matches[0][1]);
              } catch (error) {
                progress.status = 'failed';
                progress.exit_code = Number.isInteger(error.status) ? error.status : null;
                throw error;
              } finally {
                fs.writeFileSync(reportPath, JSON.stringify(report, null, 2));
              }
            }
          }
          NODE
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows' && always()
        with:
          name: beta-windows-export-source-tests-${{ needs.resolve-source.outputs.sha }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/beta-native-export-source-tests.json
          if-no-files-found: warn
          retention-days: 7
      - name: Check actual Windows PE product identity
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = Join-Path $env:CARGO_TARGET_DIR "$env:BUILD_TARGET/debug/exomind.exe"
          $identity = (Get-Item -LiteralPath $binary).VersionInfo
          if ($identity.ProductName -ne 'ExoMind Beta') { throw 'Built PE is not Beta' }
          if ($identity.ProductVersion -ne $env:BETA_VERSION -or $identity.FileVersion -ne $env:BETA_VERSION) { throw 'Built PE version does not match the exact Beta candidate' }
          # The Beta-only resource seam must override shared Alpha Cargo
          # metadata. Record and verify the actual PE, not only the config.
          $metadata = [ordered]@{product_name=$identity.ProductName;product_version=$identity.ProductVersion;file_version=$identity.FileVersion}
          $metadata | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'beta-pe-identity.json') -Encoding utf8NoBOM
      - name: Package validation executable and provenance
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import path from 'node:path'; import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process'; import {createHash} from 'node:crypto';
          const hash = file => createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          assert.equal(execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),process.env.SOURCE_SHA);
          assert.equal(hash('Cargo.lock'),process.env.CARGO_LOCK_HASH,'Build must not resolve a different dependency lock');
          assert.equal(hash('src-tauri/tauri.beta.conf.json'),process.env.BETA_CONFIG_HASH);
          assert.ok(fs.existsSync('dist/beta.html'),'Beta frontend entry was not embedded');
          const label=process.env.BUILD_LABEL, output=path.join('validation-artifacts',label);fs.mkdirSync(output,{recursive:true});
          const source=path.join(process.env.CARGO_TARGET_DIR,process.env.BUILD_TARGET,'debug',process.env.BUILD_EXECUTABLE);
          assert.ok(fs.statSync(source).isFile(),'Expected exact target executable missing');
          const binary=path.join(output,`ExoMind-${process.env.BETA_VERSION}-${label}${process.platform==='win32'?'.exe':''}`);
          fs.copyFileSync(source,binary,fs.constants.COPYFILE_EXCL);
          if(process.platform!=='win32') fs.chmodSync(binary,0o755);
          let artifact=binary;
          if(process.platform!=='win32') {artifact=binary+'.tar.gz';execFileSync('tar',['-czf',artifact,'-C',output,path.basename(binary)],{stdio:'inherit'});fs.unlinkSync(binary);}
          const config=JSON.parse(fs.readFileSync('src-tauri/tauri.beta.conf.json','utf8'));
          const native=process.platform==='win32'?JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP,'beta-pe-identity.json'),'utf8')):null;
          const info={validation_only:true,workflow_recipe_sha:process.env.WORKFLOW_RECIPE_SHA,source_sha:process.env.SOURCE_SHA,version:config.version,version_source:'tauri.beta.conf.json; VITE_APP_VERSION uses the same value',identifier:config.identifier,product_name:config.productName,entry:'beta.html',platform:label,target:process.env.BUILD_TARGET,profile:'debug embedded assets; no dev server',cargo_features:['custom-protocol','beta-native-only'],cargo_default_features:false,core_schema:Number(fs.readFileSync('crates/exomind-core/src/lib.rs','utf8').match(/CORE_SCHEMA_VERSION:\s*i64\s*=\s*(\d+)/)?.[1]),source_cargo_package_version:fs.readFileSync('src-tauri/Cargo.toml','utf8').match(/^version\s*=\s*"([^"]+)"/m)?.[1],native_resource_metadata:native,native_resource_version_matches_app:native?native.product_version===config.version&&native.file_version===config.version:null,config_sha256:process.env.BETA_CONFIG_HASH,cargo_lock_sha256:process.env.CARGO_LOCK_HASH,rustc:execFileSync('rustc',['-Vv'],{encoding:'utf8'}).trim(),cargo:execFileSync('cargo',['-V'],{encoding:'utf8'}).trim(),file:path.basename(artifact),bytes:fs.statSync(artifact).size,sha256:hash(artifact),runtime_tested:false,installer_tested:false,published:false,limitations:'Raw macOS/Linux binaries are build validation artifacts, not tested app/install packages. Device behavior and upgrade compatibility require separate same-candidate validation.'};
          fs.writeFileSync(path.join(output,'build-info.json'),JSON.stringify(info,null,2));
          NODE
      - uses: actions/upload-artifact@v7
        with:
          name: beta-${{ matrix.label }}-${{ needs.resolve-source.outputs.version }}-beta-native-only-${{ needs.resolve-source.outputs.sha }}-attempt${{ github.run_attempt }}
          path: validation-artifacts/${{ matrix.label }}/
          if-no-files-found: error
          retention-days: 7

  android:
    needs: resolve-source
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      BUILD_SCOPE: ${{ inputs.android_only && 'android-only' || 'all' }}
      ANDROID_TEST_PACKAGE_SUFFIX: ${{ inputs.android_test_package_suffix || needs.resolve-source.outputs.android_test_package_suffix || '' }}
      ANDROID_BUILD_PROFILE: ${{ inputs.android_build_profile || 'debug' }}
      SOURCE_SHA: ${{ needs.resolve-source.outputs.sha }}
      WORKFLOW_RECIPE_SHA: ${{ needs.resolve-source.outputs.recipe_sha }}
      BETA_VERSION: ${{ needs.resolve-source.outputs.version }}
      BETA_VERSION_CODE: ${{ needs.resolve-source.outputs.version_code }}
      BETA_CONFIG_HASH: ${{ needs.resolve-source.outputs.config_hash }}
      CARGO_LOCK_HASH: ${{ needs.resolve-source.outputs.cargo_lock_hash }}
      VITE_APP_VERSION: ${{ needs.resolve-source.outputs.version }}
      VITE_BUILD_HASH: ${{ needs.resolve-source.outputs.sha }}
      ANDROID_NDK_VERSION: '30.0.16248370'
      EXOMIND_ANDROID_NDK_VERSION: '30.0.16248370'
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=1 -Dkotlin.compiler.execution.strategy=in-process -Dkotlin.incremental=false -Xmx2048m
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-source.outputs.sha }}
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-source.outputs.recipe_sha }}
          path: recipe
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Install explicit Android SDK/NDK build inputs
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="$RUNNER_TEMP/beta-android-sdk"
          ndk_home="$sdk_root/ndk/$ANDROID_NDK_VERSION"
          mkdir -p "$sdk_root"
          set +o pipefail
          yes | sdkmanager --sdk_root="$sdk_root" --licenses >/dev/null
          license_status="${PIPESTATUS[1]}"
          set -o pipefail
          if [[ "$license_status" -ne 0 ]]; then exit "$license_status"; fi
          sdkmanager --sdk_root="$sdk_root" \
            'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' "ndk;$ANDROID_NDK_VERSION"
          node_binary="$(node --print 'process.execPath')"
          {
            echo "ANDROID_HOME=$sdk_root"
            echo "ANDROID_SDK_ROOT=$sdk_root"
            echo "NDK_HOME=$ndk_home"
            echo "ANDROID_NDK_HOME=$ndk_home"
            echo "BETA_ANDROID_NODE_EXECUTABLE=$node_binary"
          } >> "$GITHUB_ENV"
          export ANDROID_HOME="$sdk_root"
          export ANDROID_SDK_ROOT="$sdk_root"
          export NDK_HOME="$ndk_home"
          export ANDROID_NDK_HOME="$ndk_home"
          export BETA_ANDROID_NODE_EXECUTABLE="$node_binary"
          bun recipe/scripts/dev/beta-android-ci.ts verify-ndk
      - name: Install frozen frontend dependencies (no lifecycle scripts)
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify exact candidate before Android generation
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';import {execFileSync} from 'node:child_process';import {createHash} from 'node:crypto';
          const hash=file=>createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          assert.equal(execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),process.env.SOURCE_SHA);assert.equal(hash('Cargo.lock'),process.env.CARGO_LOCK_HASH);assert.equal(hash('src-tauri/tauri.beta.conf.json'),process.env.BETA_CONFIG_HASH);
          const config=JSON.parse(fs.readFileSync('src-tauri/tauri.beta.conf.json','utf8'));assert.equal(config.identifier,'com.exomind.app.v06.beta');assert.equal(config.version,process.env.BETA_VERSION);
          assert.ok(!fs.existsSync('src-tauri/gen/android'),'Require a fresh generated Android project, not stale Alpha/Beta output');
          NODE
      - name: Generate Beta Android project explicitly
        run: node node_modules/@tauri-apps/cli/tauri.js android init --ci --skip-targets-install --config src-tauri/tauri.beta.conf.json
      - name: Prepare Android network/system-bars/IME and symbol packaging
        shell: bash
        run: |
          bun recipe/scripts/dev/beta-android-ci.ts verify-ndk
          bun scripts/dev/android-manifest-permission.ts
          if [[ -n "$ANDROID_TEST_PACKAGE_SUFFIX" ]]; then
            bun scripts/dev/beta-android-prepare.ts --project-root "$GITHUB_WORKSPACE" --test-package-suffix "$ANDROID_TEST_PACKAGE_SUFFIX"
          else
            bun scripts/dev/beta-android-prepare.ts --project-root "$GITHUB_WORKSPACE"
          fi
      - name: Repair generated Gradle callback and verify the selected NDK
        run: bun recipe/scripts/dev/beta-android-ci.ts patch-callback --project-root "$GITHUB_WORKSPACE"
      - name: Build Beta ${{ inputs.android_build_profile || 'debug' }} APKs (arm64 and x86_64; Beta-only Rust features)
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$ANDROID_BUILD_PROFILE" == "debug" ]]; then
            node node_modules/@tauri-apps/cli/tauri.js android build --ci --debug --apk --split-per-abi -t aarch64 x86_64 --config src-tauri/tauri.beta.conf.json -- --locked --no-default-features --features custom-protocol,beta-native-only
          elif [[ "$ANDROID_BUILD_PROFILE" == "release" ]]; then
            node node_modules/@tauri-apps/cli/tauri.js android build --ci --apk --split-per-abi -t aarch64 x86_64 --config src-tauri/tauri.beta.conf.json -- --locked --no-default-features --features custom-protocol,beta-native-only
          else
            echo "Unsupported Android build profile: $ANDROID_BUILD_PROFILE" >&2
            exit 1
          fi
      - name: Sign release-profile APKs with an ephemeral comparison key
        if: ${{ inputs.android_build_profile == 'release' }}
        shell: bash
        run: |
          set -euo pipefail
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          key="$RUNNER_TEMP/beta-size-probe.jks"
          probe_pass="$(openssl rand -hex 16)"
          keytool -genkeypair -noprompt -storetype JKS -keystore "$key" \
            -storepass "$probe_pass" -keypass "$probe_pass" -alias beta-size-probe \
            -dname "CN=ExoMind Beta Release Size Probe" -keyalg RSA -keysize 2048 -validity 3650
          apk_root="src-tauri/gen/android/app/build/outputs/apk"
          found=0
          while IFS= read -r -d '' apk; do
            found=1
            aligned="${apk%.apk}.aligned.apk"
            signed="${apk%.apk}.signed.apk"
            "$build_tools/zipalign" -p -f 4 "$apk" "$aligned"
            "$build_tools/apksigner" sign --ks "$key" --ks-pass "pass:$probe_pass" \
              --key-pass "pass:$probe_pass" --ks-key-alias beta-size-probe \
              --out "$signed" "$aligned"
            "$build_tools/apksigner" verify --verbose "$signed"
            mv "$signed" "$apk"
            rm -f "$aligned"
          done < <(find "$apk_root" -type f -name '*release*.apk' ! -name '*androidTest*' -print0)
          if [[ "$found" -ne 1 ]]; then
            echo 'Expected release-profile APKs to sign.' >&2
            exit 1
          fi
          echo 'Release-profile artifacts use a runner-generated comparison key, not the release signing key.'
      - name: Verify Android callback and NDK provenance after build
        run: bun recipe/scripts/dev/beta-android-ci.ts verify-prepared --project-root "$GITHUB_WORKSPACE"
      - name: Verify actual APK identities and write provenance
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';import assert from 'node:assert/strict';import {execFileSync} from 'node:child_process';import {createHash} from 'node:crypto';
          const hash=file=>createHash('sha256').update(fs.readFileSync(file)).digest('hex');assert.equal(execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),process.env.SOURCE_SHA);assert.equal(hash('Cargo.lock'),process.env.CARGO_LOCK_HASH);assert.equal(hash('src-tauri/tauri.beta.conf.json'),process.env.BETA_CONFIG_HASH);assert.ok(fs.existsSync('dist/beta.html'));
          const root='src-tauri/gen/android/app/build/outputs/apk',output='validation-artifacts/android';fs.mkdirSync(output,{recursive:true});
          const walk=directory=>fs.readdirSync(directory,{withFileTypes:true}).flatMap(entry=>entry.isDirectory()?walk(path.join(directory,entry.name)):[path.join(directory,entry.name)]);
