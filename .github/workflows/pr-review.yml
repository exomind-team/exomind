name: "Black Hat Critic - PR Review"

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  # ═══════════════════════════════════════════
  # 第一关：Codex 5.3 CLI 快速扫描
  # ═══════════════════════════════════════════
  codex-review:
    if: |
      (github.event_name == 'pull_request') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@critic')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@critic'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    outputs:
      final_message: ${{ steps.run_codex.outputs.final-message }}
    steps:
      - name: Resolve PR number
        id: pr
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            echo "number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request_review_comment" ]; then
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ steps.pr.outputs.number }}/merge

      - name: Pre-fetch base and head refs
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin \
              ${{ github.event.pull_request.base.ref }} \
              +refs/pull/${{ github.event.pull_request.number }}/head
          else
            git fetch --no-tags origin
          fi

      - name: Run Codex
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.REVIEW_API_KEY }}
          responses-api-endpoint: ${{ secrets.REVIEW_API_BASE }}/responses
          model: codex-5.3
          effort: high
          prompt: |
            This is PR #${{ steps.pr.outputs.number }} for ${{ github.repository }}.
            Review ONLY the changes introduced by the PR:
              git log --oneline ${{ github.event.pull_request.base.sha || 'HEAD~1' }}...${{ github.event.pull_request.head.sha || 'HEAD' }}

            Focus on:
            1. 规范性：commit message、PR 关联 Issue、代码风格
            2. 明显 bug 或安全隐患
            3. 不必要的复杂度

            PR title: ${{ github.event.pull_request.title || github.event.issue.title }}

            输出格式：
            - 每项用 🟢(pass) 🟡(建议) 🔴(必须修) 标记
            - 最后一行给出结论：✅ 可合并 / ⚠️ 建议修改后合并 / ❌ 需要修改
            - 言简意赅，不要废话

  post-codex-feedback:
    needs: codex-review
    runs-on: ubuntu-latest
    if: needs.codex-review.outputs.final_message != ''
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Resolve PR number
        id: pr
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            echo "number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request_review_comment" ]; then
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Post Codex Review
        uses: actions/github-script@v7
        env:
          CODEX_FINAL_MESSAGE: ${{ needs.codex-review.outputs.final_message }}
        with:
          github-token: ${{ github.token }}
          script: |
            const body = `## 🎩⚡ 黑帽 Critic — 第一关 Codex 快速扫描\n\n${process.env.CODEX_FINAL_MESSAGE}\n\n---\n*Codex 5.3 (reasoning: high) · ExoMind Feature Flow v2*`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.pr.outputs.number }},
              body,
            });

  # ═══════════════════════════════════════════
  # 第二关：Claude Opus 4.6 CLI 深度评审
  # ═══════════════════════════════════════════
  claude-deep-review:
    if: |
      (github.event_name == 'pull_request') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@critic')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@critic'))
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    env:
      ANTHROPIC_BASE_URL: ${{ secrets.OPUS_API_BASE }}
    steps:
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.OPUS_API_KEY }}
          claude_args: "--model claude-opus-4-6"
          trigger_phrase: "@critic"
          prompt: |
            你是 ExoMind 项目的黑帽 Critic（Feature Flow v2）。对这个 PR 做深度评审。

            评审维度：
            1. 架构合理性：是否符合项目现有模式
            2. 边界条件与错误处理
            3. 性能影响
            4. 返工风险：这段代码未来大概率需要改的地方

            输出要求：
            - 每项用 🟢(pass) 🟡(建议) 🔴(必须修) 标记
            - 言简意赅，每条不超过2行
            - 最后必须给出明确结论，用以下格式之一：

            ### ✅ 可合并
            ### ⚠️ 建议修改后合并
            ### ❌ 需要修改后重新评审
