[package]
name = "exomind-runtime"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "exomind-rt"
path = "src/main.rs"

[dependencies]
axum = "0.7"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
thiserror = "1"

[dev-dependencies]
http-body-util = "0.1"
serde_json = "1"
tower = { version = "0.5", features = ["util"] }

